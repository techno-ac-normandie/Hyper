<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HYPERTROPHY.OS">
  <meta name="theme-color" content="#000000">
  <title>HYPERTROPHY.OS v0.4.8</title>
  <style>
    :root {
      --bg-pure: #000000;
      --surface: #121212;
      --surface-elevated: #1c1c1e;
      --surface-glass: rgba(24, 24, 27, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(255, 255, 255, 0.16);
      --ios-blue: #0a84ff;
      --ios-green: #30d158;
      --ios-orange: #ff9f0a;
      --ios-red: #ff453a;
      --ios-purple: #bf5af2;
      --ios-grey: #8e8e93;
      --safe-top: env(safe-area-inset-top, 14px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      touch-action: manipulation;
    }

    input, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-pure);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100dvh;
    }

    /* Viewport calibré iPhone 17/18 Pro Max (430x932px) */
    .iphone-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      margin: 0 auto;
      background-color: var(--bg-pure);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(116px + var(--safe-bottom));
      transition: padding-bottom 0.2s ease;
      border-left: 1px solid rgba(255, 255, 255, 0.04);
      border-right: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* Compensation dynamique lorsque la fenêtre flottante de repos est affichée */
    .iphone-shell.has-floating-rest {
      padding-bottom: calc(236px + var(--safe-bottom));
    }

    .ios-glass {
      background: var(--surface-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .ios-card {
      background-color: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
    }

    .ios-card-interactive {
      background-color: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.15s ease, background-color 0.15s ease;
    }

    .ios-card-interactive:active {
      transform: scale(0.98);
      background-color: #1a1a1d;
      border-color: var(--border-highlight);
    }

    .btn-active {
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .btn-active:active {
      transform: scale(0.96);
    }

    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1 1 0%; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .items-end { align-items: flex-end; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .grid { display: grid; }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-cols-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .gap-1 { gap: 4px; }
    .gap-1-5 { gap: 6px; }
    .gap-2 { gap: 8px; }
    .gap-2-5 { gap: 10px; }
    .gap-3 { gap: 12px; }
    .space-y-1 > * + * { margin-top: 4px; }
    .space-y-1-5 > * + * { margin-top: 6px; }
    .space-y-2 > * + * { margin-top: 8px; }
    .space-y-2-5 > * + * { margin-top: 10px; }
    .space-y-3 > * + * { margin-top: 12px; }
    .space-y-3-5 > * + * { margin-top: 14px; }
    .space-y-4 > * + * { margin-top: 16px; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .shrink-0 { flex-shrink: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .text-left { text-align: left; }
    .uppercase { text-transform: uppercase; }
    .capitalize { text-transform: capitalize; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .leading-tight { line-height: 1.2; }
    .leading-snug { line-height: 1.35; }
    .leading-relaxed { line-height: 1.48; }
    .cursor-pointer { cursor: pointer; }
    .hidden { display: none !important; }
    .overflow-hidden { overflow: hidden; }
    .overflow-y-auto { overflow-y: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes slideUpSheet {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeInBackdrop {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulseUrgent {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .sheet-animate {
      animation: slideUpSheet 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .backdrop-animate {
      animation: fadeInBackdrop 0.2s ease-out forwards;
    }
    .pulse-urgent {
      animation: pulseUrgent 0.85s infinite ease-in-out;
    }

    input[type="range"].ios-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #2c2c2e;
      outline: none;
    }
    input[type="range"].ios-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.65);
      cursor: pointer;
      border: 2px solid var(--ios-blue);
    }
  </style>
</head>
<body>

  <div id="app" class="iphone-shell">
    <!-- Top Fixed Navigation Header -->
    <header id="app-header" style="position:sticky;top:0;z-index:30;padding:max(12px,var(--safe-top)) 16px 12px 16px;border-bottom:1px solid var(--border-subtle);" class="ios-glass"></header>

    <!-- Main Dynamic View Container -->
    <main id="app-main" style="flex:1;padding:12px 14px 32px 14px;" class="space-y-4"></main>

    <!-- Fenêtre Contextuelle Flottante & Statique du Chronomètre de Repos -->
    <div id="floating-rest-overlay" style="display:none;position:fixed;bottom:calc(86px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:402px;z-index:35;border-radius:18px;padding:12px 14px;border:1.5px solid rgba(10,132,255,0.55);box-shadow:0 14px 34px rgba(0,0,0,0.88);" class="ios-glass">
      <div class="flex items-center justify-between gap-2" style="margin-bottom:6px;">
        <div class="flex items-center gap-1-5 truncate">
          <span id="float-rest-dot" style="width:9px;height:9px;border-radius:999px;background:#0a84ff;flex-shrink:0;"></span>
          <span id="float-rest-label" class="truncate" style="font-size:11px;font-weight:700;color:#e5e5ea;">Repos en cours</span>
        </div>
        <button id="float-rest-back-btn" onclick="navigateTo('workout', UIState.state?.activeSession?.sessionCode)" style="display:none;padding:3px 8px;border-radius:7px;background:rgba(10,132,255,0.22);border:1px solid rgba(10,132,255,0.45);color:#0a84ff;font-size:10px;font-weight:700;flex-shrink:0;">
          ← Séance
        </button>
      </div>

      <div class="flex items-center justify-between gap-3">
        <div id="float-rest-clock" class="tabular-nums" style="font-size:32px;font-weight:800;letter-spacing:-0.03em;line-height:1;color:#0a84ff;">
          02:00
        </div>
        <div class="flex items-center gap-1-5">
          <button onclick="adjustRestTimer(-15)" class="btn-active" style="padding:8px 10px;border-radius:10px;background:#1c1c1e;border:1px solid var(--border-subtle);font-size:12px;font-weight:700;color:#fff;">-15s</button>
          <button onclick="adjustRestTimer(15)" class="btn-active" style="padding:8px 10px;border-radius:10px;background:#1c1c1e;border:1px solid var(--border-subtle);font-size:12px;font-weight:700;color:#0a84ff;">+15s</button>
          <button onclick="adjustRestTimer(0)" class="btn-active" style="padding:8px 11px;border-radius:10px;background:rgba(255,69,58,0.2);border:1px solid rgba(255,69,58,0.35);font-size:12px;font-weight:700;color:#ff453a;">Passer</button>
        </div>
      </div>

      <div class="w-full overflow-hidden" style="height:5px;background:#2c2c2e;border-radius:999px;margin-top:8px;">
        <div id="float-rest-bar" style="height:100%;width:100%;background:#0a84ff;transition:width 0.25s linear;"></div>
      </div>
    </div>

    <!-- Sticky Bottom Action Bar -->
    <div id="app-bottom-bar" style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;padding:10px 16px max(14px,var(--safe-bottom)) 16px;border-top:1px solid var(--border-subtle);" class="ios-glass"></div>
  </div>

  <!-- Global Bottom Sheet & Full-Page Summary Modal Portal -->
  <div id="modal-root" style="position:fixed;inset:0;z-index:50;pointer-events:none;"></div>

  <!-- Toast Notification Portal -->
  <div id="toast-root" style="position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:60;width:100%;max-width:398px;padding:0 14px;pointer-events:none;"></div>

  <script>
    /********************************************************************
     * HYPERTROPHY.OS v0.4.8 — SINGLE FILE SPA / PWA (100% OFFLINE)
     * Persistance exclusive : IndexedDB (HypertrophyDB / AppStateStore)
     * Zéro localStorage, zéro dépendance externe.
     ********************************************************************/

    const APP_VERSION = 'v0.4.8';
    const DB_NAME = 'HypertrophyDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'AppStateStore';
    const STATE_KEY = 'main_state';

    // Rééquilibrage ceinture scapulaire ++ : Pectoraux (10), Épaules (9), Dos (10)
    const MUSCLE_META = {
      'Pectoraux':  { col: 'FACE', targetSets: 10, refExerciseId: 'ua_a1', refShortName: 'Chestpress' },
      'Épaules':    { col: 'FACE', targetSets: 9,  refExerciseId: 'ub_a1', refShortName: 'Shoulderpress' },
      'Bras':       { col: 'FACE', targetSets: 6,  refExerciseId: 'ua_c',  refShortName: 'Ext. Triceps' },
      'Quadriceps': { col: 'FACE', targetSets: 7,  refExerciseId: 'la_a',  refShortName: 'Goblet Squat' },
      'Tronc':      { col: 'FACE', targetSets: 6,  refExerciseId: 'la_c',  refShortName: 'Pallof Press' },
      'Dos':        { col: 'DOS',  targetSets: 10, refExerciseId: 'ua_a2', refShortName: 'Tirage Vert.' },
      'Ischios':    { col: 'DOS',  targetSets: 8,  refExerciseId: 'lb_a',  refShortName: 'B-Stance RDL' }
    };

    // Protocole d'entraînement (4 jours : Lun, Mar, Jeu, Ven + Sam/Dim tampons) + 2 Micro-séances de Calibration
    const SESSION_TEMPLATES = {
      'UA': {
        code: 'UA',
        name: 'Séance 1 : Upper A',
        subtitle: 'Poussée horizontale / Tirage vertical + Épaules',
        defaultDayOfWeek: 1,
        durationTarget: '35-40 min',
        exercises: ['ua_a1', 'ua_a2', 'ua_b1', 'ua_b2', 'ua_c']
      },
      'LA': {
        code: 'LA',
        name: 'Séance 2 : Lower A',
        subtitle: 'Quadriceps / Stabilité pelvienne (Zéro charge axiale)',
        defaultDayOfWeek: 2,
        durationTarget: '30-35 min',
        exercises: ['la_a', 'la_b', 'la_c']
      },
      'UB': {
        code: 'UB',
        name: 'Séance 3 : Upper B',
        subtitle: 'Poussée verticale / Tirage horizontal + Écarté incliné',
        defaultDayOfWeek: 4,
        durationTarget: '35-40 min',
        exercises: ['ub_a1', 'ub_a2', 'ub_b1', 'ub_b2', 'ub_c', 'ub_d']
      },
      'LB': {
        code: 'LB',
        name: 'Séance 4 : Lower B',
        subtitle: 'Chaîne postérieure / Ischios & Gainage anti-inclinaison',
        defaultDayOfWeek: 5,
        durationTarget: '30-35 min',
        exercises: ['lb_a', 'lb_b', 'lb_c']
      },
      'CAL_U': {
        code: 'CAL_U',
        name: 'Calibration 1/2 : Test Upper',
        subtitle: '2 séries légères + 1 Top Set (6-10 reps, RIR 0 technique)',
        defaultDayOfWeek: 1,
        durationTarget: '20 min',
        isCalibrationSession: true,
        exercises: ['ua_a1', 'ua_a2', 'ub_a1', 'ub_a2']
      },
      'CAL_L': {
        code: 'CAL_L',
        name: 'Calibration 2/2 : Test Lower',
        subtitle: '2 séries légères + 1 Top Set (6-10 reps, RIR 0 technique)',
        defaultDayOfWeek: 2,
        durationTarget: '20 min',
        isCalibrationSession: true,
        exercises: ['la_a', 'lb_a']
      }
    };

    /********************************************************************
     * UTILITAIRES TEMPORELS & MATHÉMATIQUES
     ********************************************************************/
    function formatDateISO(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDays(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      dt.setDate(dt.getDate() + days);
      return formatDateISO(dt);
    }

    function getMondayOfWeek(dateObj) {
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), 12, 0, 0);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      d.setDate(diff);
      return formatDateISO(d);
    }

    function formatFrenchDate(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function formatShortFrenchDate(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
    }

    function formatMMSS(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const mins = String(Math.floor(s / 60)).padStart(2, '0');
      const secs = String(s % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function isTimedExercise(ex) {
      return !!(ex && typeof ex.unit === 'string' && ex.unit.toLowerCase().includes('sec'));
    }

    function formatMetricUnit(ex) {
      return isTimedExercise(ex) ? 'idx' : 'kg';
    }

    // Formule de Brzycki ajustée au RIR + gestion dédiée poids du corps réel & exercices chronométrés/isométriques
    function computeE1RM(weight, reps, rir, options = {}) {
      const w = parseFloat(weight) || 0;
      const r = parseInt(reps, 10) || 0;
      const effRir = Math.min(4, Math.max(0, parseInt(rir, 10) || 0));
      const isTimed = !!options.isTimed || (typeof options.unit === 'string' && options.unit.toLowerCase().includes('sec'));

      // Exercices isométriques / chronométrés (ex. Pallof Press, Suitcase Carry) :
      // Indice de tension normalisé sur une base de 15s (linéaire en charge et durée, sans distorsion Brzycki)
      if (isTimed) {
        const effectiveW = w > 0 ? w : 10;
        return Math.round(effectiveW * (Math.max(1, r) / 15) * 10) / 10;
      }

      // Exercices au poids du corps (ex. Fentes inversées unilatérales) : utilise le poids corporel réel (facteur 0.65)
      if (w <= 0) {
        const bw = parseFloat(options.bodyweight) || (typeof UIState !== 'undefined' && UIState.state?.profile?.weight) || 110;
        const effectiveLoad = bw * 0.65;
        const totalBw = Math.min(25, r + effRir);
        const denomBw = 1.0278 - (0.0278 * totalBw);
        return Math.round((effectiveLoad / Math.max(0.2, denomBw)) * 10) / 10;
      }

      const total = Math.min(28, r + effRir);
      const denom = 1.0278 - (0.0278 * total);
      if (denom <= 0.1) return w;
      return Math.round((w / denom) * 10) / 10;
    }

    function roundToHalfKg(val) {
      return Math.round(val * 2) / 2;
    }

    function roundToTwoHalfKg(val) {
      return Math.max(2.5, Math.round(val / 2.5) * 2.5);
    }

    // Dérivation des charges de travail Semaine 1 (8-12 reps @ RIR 1-2) à partir de l'e1RM calibré
    function computeWorkingWeightFromE1RM(e1rm, targetReps, targetRir) {
      if (!e1rm || e1rm <= 0) return 0;
      const factor = 1.0278 - 0.0278 * (targetReps + targetRir);
      return Math.max(2.5, roundToHalfKg(e1rm * Math.max(0.45, factor)));
    }

    function applyCalibratedWeightsToAllExercises(state) {
      const cat = state.catalog;
      const e1rmChest = cat['ua_a1']?.calibratedE1rm || computeE1RM(cat['ua_a1'].targetWeight, 9, 2);
      const e1rmLat   = cat['ua_a2']?.calibratedE1rm || computeE1RM(cat['ua_a2'].targetWeight, 9, 2);
      const e1rmShld  = cat['ub_a1']?.calibratedE1rm || computeE1RM(cat['ub_a1'].targetWeight, 9, 2);
      const e1rmRow   = cat['ub_a2']?.calibratedE1rm || computeE1RM(cat['ub_a2'].targetWeight, 9, 2);
      const e1rmSquat = cat['la_a']?.calibratedE1rm  || computeE1RM(cat['la_a'].targetWeight, 9, 2);
      const e1rmRdl   = cat['lb_a']?.calibratedE1rm  || computeE1RM(cat['lb_a'].targetWeight, 9, 2);

      // 1. Les 6 mouvements principaux calibrés directement
      const directMap = {
        'ua_a1': e1rmChest,
        'ua_a2': e1rmLat,
        'ub_a1': e1rmShld,
        'ub_a2': e1rmRow,
        'la_a':  e1rmSquat,
        'lb_a':  e1rmRdl
      };

      Object.entries(directMap).forEach(([id, e1]) => {
        const ex = cat[id];
        if (!ex) return;
        const w = computeWorkingWeightFromE1RM(e1, ex.minReps + 1, ex.targetRir);
        ex.targetWeight = w;
        ex.baseWeight = w;
        ex.calibrated = true;
      });

      // 2. Dérivation conservatrice des exercices complémentaires / isolation (sans test requis)
      const derivedRatios = [
        { id: 'ua_b1', refE1rm: e1rmShld,  ratio: 0.48 },
        { id: 'ua_b2', refE1rm: e1rmLat,   ratio: 0.85 },
        { id: 'ua_c',  refE1rm: e1rmChest, ratio: 0.34 },
        { id: 'la_c',  refE1rm: e1rmSquat, ratio: 0.32 },
        { id: 'ub_b1', refE1rm: e1rmChest, ratio: 0.22 },
        { id: 'ub_b2', refE1rm: e1rmShld,  ratio: 0.18 },
        { id: 'ub_c',  refE1rm: e1rmRow,   ratio: 1.15 },
        { id: 'ub_d',  refE1rm: e1rmLat,   ratio: 0.42 },
        { id: 'lb_b',  refE1rm: e1rmRdl,   ratio: 1.50 }
      ];

      derivedRatios.forEach(item => {
        const ex = cat[item.id];
        if (!ex) return;
        const estE1rm = item.refE1rm * item.ratio;
        const w = computeWorkingWeightFromE1RM(estE1rm, ex.minReps + 1, ex.targetRir);
        ex.targetWeight = w;
        ex.baseWeight = w;
        ex.calibrated = true;
      });

      if (cat['la_b']) { cat['la_b'].targetWeight = 0; cat['la_b'].baseWeight = 0; cat['la_b'].calibrated = true; }
      if (cat['lb_c']) { cat['lb_c'].targetWeight = 10; cat['lb_c'].baseWeight = 10; cat['lb_c'].calibrated = true; }
    }

    /********************************************************************
     * CATALOGUE EXERCICES (AVEC MICRO-SÉANCES DE CALIBRATION)
     ********************************************************************/
    function createInitialCatalog(withDemoHistory = true) {
      const today = new Date();
      const dMinus7 = addDays(formatDateISO(today), -7);
      const dMinus6 = addDays(formatDateISO(today), -6);
      const dMinus4 = addDays(formatDateISO(today), -4);
      const dMinus3 = addDays(formatDateISO(today), -3);

      const baseCatalog = {
        // SÉANCE 1 : UPPER A
        'ua_a1': {
          id: 'ua_a1', sessionCode: 'UA', order: 'A1', blockCode: 'A', supersetGroup: 'A', supersetPartner: 'ua_a2',
          name: 'Chestpress poulie Matrix (Banc plat)',
          equipment: 'Poulie Matrix convergente • Banc plat',
          muscle: 'Pectoraux', isRef: true,
          targetSets: 4, minReps: 8, maxReps: 10, targetRir: 2, targetWeight: 65,
          baseSets: 4, baseWeight: 65,
          unit: 'reps', isLowerPosteriorOrAxialSensitive: false,
          biomechanicalNote: 'Omoplates rétractées et basses, coudes à 45° pour protéger la gléno-humérale.',
          history: withDemoHistory ? [
            { date: addDays(dMinus7, -7), weight: 62.5, reps: 9, rir: 2, sets: 4, e1rm: computeE1RM(62.5, 9, 2) },
            { date: dMinus7, weight: 65, reps: 9, rir: 2, sets: 4, e1rm: computeE1RM(65, 9, 2) }
          ] : []
        },
        'ua_a2': {
          id: 'ua_a2', sessionCode: 'UA', order: 'A2', blockCode: 'A', supersetGroup: 'A', supersetPartner: 'ua_a1',

    /********************************************************************
     * PERSISTANCE 100% INDEXEDDB (ZÉRO LOCALSTORAGE)
     ********************************************************************/
    const DB = {
      dbInstance: null,
      openPromise: null,
      memoryFallback: null,
      _saveTimer: null,
      _pendingState: null,

      open(forceReopen = false) {
        if (forceReopen && this.dbInstance) {
          try { this.dbInstance.close(); } catch (_) {}
          this.dbInstance = null;
        }
        if (this.dbInstance) return Promise.resolve(this.dbInstance);
        if (this.openPromise) return this.openPromise;

        this.openPromise = new Promise((resolve, reject) => {
          try {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
              }
            };
            req.onsuccess = (e) => {
              const db = e.target.result;
              db.onclose = () => {
                if (this.dbInstance === db) this.dbInstance = null;
              };
              db.onversionchange = () => {
                try { db.close(); } catch (_) {}
                if (this.dbInstance === db) this.dbInstance = null;
              };
              this.dbInstance = db;
              this.openPromise = null;
              resolve(db);
            };
            req.onerror = (e) => {
              this.openPromise = null;
              reject(e.target.error);
            };
            req.onblocked = () => {
              this.openPromise = null;
              reject(new Error('IndexedDB blocked'));
            };
          } catch (err) {
            this.openPromise = null;
            reject(err);
          }
        });

        return this.openPromise;
      },

      async _withStore(mode, callback, isRetry = false) {
        try {
          const db = await this.open(isRetry);
          return await new Promise((resolve, reject) => {
            let tx;
            try {
              tx = db.transaction(STORE_NAME, mode);
            } catch (txErr) {
              return reject(txErr);
            }
            const store = tx.objectStore(STORE_NAME);
            let reqResult;
            try {
              reqResult = callback(store, tx);
            } catch (cbErr) {
              return reject(cbErr);
            }

            tx.oncomplete = () => resolve(reqResult?.result !== undefined ? reqResult.result : true);
            tx.onerror = () => reject(tx.error || new Error('Transaction error'));
            tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
          });
        } catch (err) {
          if (!isRetry && (err?.name === 'InvalidStateError' || String(err?.message || '').includes('closing'))) {
            this.dbInstance = null;
            return this._withStore(mode, callback, true);
          }
          throw err;
        }
      },

      async loadState() {
        try {
          const result = await this._withStore('readonly', (store) => store.get(STATE_KEY));
          if (result) {
            if (!result.catalog['ub_b1'] || !result.catalog['ub_b1'].name.includes('Écarté incliné')) {
              const fresh = createSeedState(true);
              result.catalog['ub_b1'] = fresh.catalog['ub_b1'];
              result.catalog['ub_b2'] = fresh.catalog['ub_b2'];
              result.catalog['ub_a2'].targetSets = 3;
              result.catalog['ub_a2'].baseSets = 3;
              result.catalog['ub_c'].targetSets = 2;
              result.catalog['ub_c'].baseSets = 2;
            }
            if (result.mesocycleState.sessionsCompletedInMesocycle === undefined) {
              result.mesocycleState.sessionsCompletedInMesocycle = result.sessionLogs.length;
            }
            if (result.mesocycleState.deloadSessionsRemaining === undefined) {
              result.mesocycleState.deloadSessionsRemaining = 0;
            }
            if (!Array.isArray(result.mesocycleState.calibratedSessions)) {
              result.mesocycleState.calibratedSessions = [];
            }
            result.version = APP_VERSION;
            this.memoryFallback = result;
            return result;
          } else {
            const seed = this.memoryFallback || createSeedState(true);
            await this.saveState(seed);
            return seed;
          }
        } catch (err) {
          console.warn('IndexedDB fallback actif (loadState):', err);
          if (!this.memoryFallback) {
            this.memoryFallback = createSeedState(true);
          }
          return this.memoryFallback;
        }
      },

      async saveState(stateObj) {
        stateObj.id = STATE_KEY;
        this.memoryFallback = stateObj;
        this._pendingState = null;
        if (this._saveTimer) {
          clearTimeout(this._saveTimer);
          this._saveTimer = null;
        }
        try {
          await this._withStore('readwrite', (store) => store.put(stateObj));
          return true;
        } catch (err) {
          console.warn('IndexedDB sauvegarde différée:', err);
          return false;
        }
      },

      // Écriture asynchrone dédoublonnée pour préserver la fluidité 60fps lors des tapotements rapides
      scheduleSave(stateObj, delayMs = 220) {
        stateObj.id = STATE_KEY;
        this.memoryFallback = stateObj;
        this._pendingState = stateObj;
        if (this._saveTimer) clearTimeout(this._saveTimer);
        this._saveTimer = setTimeout(() => {
          const toSave = this._pendingState;
          this._saveTimer = null;
          if (toSave) {
            this.saveState(toSave);
          }
        }, delayMs);
      }
    };

    /********************************************************************
     * ALGORITHME DE CALENDRIER GLISSANT (ROLLING CALENDAR)
     ********************************************************************/
    function computeWeeklyRollingSchedule(state) {
      const todayStr = formatDateISO(new Date());
      const mondayStr = getMondayOfWeek(new Date());
      const simOffset = state.mesocycleState.simulatedMissedDays || 0;
      const effectiveTodayStr = addDays(todayStr, simOffset);

      const sundayStr = addDays(mondayStr, 6);
      const logsThisWeek = state.sessionLogs.filter(
        l => l.date >= mondayStr && l.date <= sundayStr && !l.sessionCode.startsWith('CAL_')
      );
      const completedCodes = new Set(logsThisWeek.map(l => l.sessionCode));

      const baseSlots = [
        { code: 'UA', baseOffset: 0 },
        { code: 'LA', baseOffset: 1 },
        { code: 'UB', baseOffset: 3 },
        { code: 'LB', baseOffset: 4 }
      ];

      const scheduleMap = {};
      logsThisWeek.forEach(log => {
        scheduleMap[log.date] = {
          type: 'completed',
          sessionCode: log.sessionCode,
          shifted: false,
          log
        };
      });

      let cursorDate = effectiveTodayStr;

      baseSlots.forEach(slot => {
        if (completedCodes.has(slot.code)) return;

        const initialDate = addDays(mondayStr, slot.baseOffset);
        let targetDate = initialDate;
        let wasShifted = false;

        if (targetDate < effectiveTodayStr || scheduleMap[targetDate]) {
          wasShifted = true;
          targetDate = cursorDate > initialDate ? cursorDate : initialDate;
          while (scheduleMap[targetDate] && targetDate <= sundayStr) {
            targetDate = addDays(targetDate, 1);
          }
          const wednesdayStr = addDays(mondayStr, 2);
          if (targetDate === wednesdayStr && targetDate > effectiveTodayStr) {
            targetDate = addDays(targetDate, 1);
          }
        }

        if (targetDate <= sundayStr) {
          scheduleMap[targetDate] = {
            type: 'scheduled',
            sessionCode: slot.code,
            shifted: wasShifted,
            initialDate
          };
          cursorDate = addDays(targetDate, 1);
        }
      });

      return {
        mondayStr,
        sundayStr,
        todayStr,
        effectiveTodayStr,
        scheduleMap
      };
    }

    /********************************************************************
     * MOTEUR DÉCISIONNEL HYBRIDE DE FIN DE MÉSOCYCLE (CONFIRMATION + REPORT)
     ********************************************************************/
    function evaluateMesocycleEndSignals(state, allLogsWithLatest) {
      const mState = state.mesocycleState;
      if (mState.deloadActive || mState.calibrationMode) return null;

      const signals = [];
      const currentWeek = mState.week || 1;
      const sessionsDone = mState.sessionsCompletedInMesocycle || allLogsWithLatest.length;

      // Signal 1 : Plafond calendaire (Semaine >= 5 ou >= 16 séances d'accumulation)
      if (currentWeek >= 5 || sessionsDone >= 16) {
        signals.push({
          id: 'WEEK_CAP',
          severity: 'info',
          title: `Plafond du mésocycle atteint (Semaine ${currentWeek})`,
          detail: `${sessionsDone} séances cumulées : une décharge de 4 séances dissipera la fatigue résiduelle.`
        });
      }

      // Signal 2 : Fatigue SNC sur fenêtre glissante de 4 séances (RPE moyen > 8.5/10)
      const last4Logs = allLogsWithLatest.slice(-4);
      if (last4Logs.length >= 3) {
        const avgRpe = last4Logs.reduce((acc, l) => acc + (l.rpe || 7.5), 0) / last4Logs.length;
        if (avgRpe > 8.5) {
          signals.push({
            id: 'SNC_FATIGUE',
            severity: 'warning',
            title: `Fatigue nerveuse élevée (RPE moy. ${avgRpe.toFixed(1)}/10)`,
            detail: `Moyenne > 8.5/10 sur les ${last4Logs.length} dernières séances.`
          });
        }
      }

      // Signal 3 : Douleur Lombaire / Sacro-Iliaque >= 4/10 sur 2 séances consécutives
      if (allLogsWithLatest.length >= 2) {
        const prev = allLogsWithLatest[allLogsWithLatest.length - 2];
        const curr = allLogsWithLatest[allLogsWithLatest.length - 1];
        if ((prev.painIndex || 0) >= 4 && (curr.painIndex || 0) >= 4) {
          signals.push({
            id: 'CLINICAL_PAIN_2X',
            severity: 'critical',
            title: `Douleur Sacro-Iliaque persistante (${prev.painIndex}/10 puis ${curr.painIndex}/10)`,
            detail: `Seuil clinique ≥ 4/10 atteint sur 2 séances consécutives.`
          });
        }
      }

      // Signal 4 : Stagnation multi-exercices filtrée du bruit (>= 3 occurrences sur >= 50% des mouvements clés)
      const keyExercises = Object.values(state.catalog).filter(
        ex => (ex.blockCode === 'A' || ex.isRef) && !isTimedExercise(ex)
      );
      let evaluatedCount = 0;
      const stagnatingNames = [];

      keyExercises.forEach(ex => {
        const h = ex.history || [];
        if (h.length >= 3) {
          evaluatedCount++;
          const last3 = h.slice(-3);
          const e1 = last3[0].e1rm;
          const e2 = last3[1].e1rm;
          const e3 = last3[2].e1rm;
          if (e2 <= e1 && e3 <= e2) {
            stagnatingNames.push(ex.name.split('(')[0].trim());
          }
        }
      });

      if (evaluatedCount >= 3 && stagnatingNames.length >= Math.ceil(evaluatedCount * 0.5)) {
        signals.push({
          id: 'MULTI_STAGNATION',
          severity: 'warning',
          title: `Stagnation multi-exercices (${stagnatingNames.length}/${evaluatedCount} mouvements clés)`,
          detail: `Plafonnement de l'e1RM sur 3 occurrences consécutives (${stagnatingNames.slice(0, 3).join(', ')}).`
        });
      }

      if (signals.length === 0) return null;

      const signature = signals.map(s => s.id).sort().join('+');
      const prevDismissed = mState.dismissedSignalSignature;
      let isEscalation = false;
      let isPersistent = false;

      if (prevDismissed) {
        const prevSet = new Set(prevDismissed.split('+'));
        const hasNewSignal = signals.some(s => !prevSet.has(s.id));
        if (hasNewSignal) {
          isEscalation = true;
        } else {
          isPersistent = true;
        }
      }

      return {
        detectedAt: formatDateISO(new Date()),
        signature,
        isPersistent,
        isEscalation,
        signals
      };
    }

    /********************************************************************
     * CALCUL VOLUME & CHAÎNE DE MARKOV + DIAGNOSTIC VISUEL POST-SÉANCE
     ********************************************************************/
    function getMuscleStats(state, muscleName) {
      const meta = MUSCLE_META[muscleName];
      const refEx = state.catalog[meta.refExerciseId];
      const hist = refEx.history || [];

      let currentE1rm = computeE1RM(refEx.targetWeight, refEx.minReps, refEx.targetRir, {
        isTimed: isTimedExercise(refEx),
        bodyweight: state.profile?.weight
      });
      let evolutionPct = 0;

      if (hist.length >= 1) {
        currentE1rm = hist[hist.length - 1].e1rm;
      }
      if (hist.length >= 2) {
        const prev = hist[hist.length - 2].e1rm;
        if (prev > 0) {
          evolutionPct = Math.round(((currentE1rm - prev) / prev) * 1000) / 10;
        }
      }

      const sevenDaysAgo = addDays(formatDateISO(new Date()), -6);
      let completedHardSets = 0;

      state.sessionLogs.forEach(log => {
        if (log.date >= sevenDaysAgo && !log.sessionCode.startsWith('CAL_')) {
          (log.exercisesLogged || []).forEach(exLog => {
            const catItem = state.catalog[exLog.id];
            if (catItem && catItem.muscle === muscleName) {
              completedHardSets += (exLog.hardSets !== undefined ? exLog.hardSets : exLog.sets);
            }
          });
        }
      });

      const targetSets = state.mesocycleState.deloadActive
        ? Math.max(2, Math.round(meta.targetSets * 0.65))
        : meta.targetSets;

      return {
        muscleName,
        col: meta.col,
        refShortName: meta.refShortName,
        refExerciseId: meta.refExerciseId,
        refUnit: formatMetricUnit(refEx),
        currentE1rm,
        evolutionPct,
        completedHardSets,
        targetSets
      };
    }

    function applyMarkovPostSession(state, sessionCode, sessionTelemetry, rpeGlobal, painIndex) {
      const todayStr = formatDateISO(new Date());
      const diagnostics = [];
      const strengths = [];
      const weaknesses = [];
      const nextSessionAdjustments = [];
      let optimal = true;

      const {
        loggedExercises,
        durationSec,
        activeSec,
        restSec,
        transitionSec,
        rawSetsAnalysis
      } = sessionTelemetry;

      const durMin = Math.round(durationSec / 60);
      if (durMin <= 40) {
        strengths.push(`Densité horaire maîtrisée (${durMin} min ≤ 40 min cibles).`);
      } else {
        weaknesses.push(`Durée totale de ${durMin} min supérieure au plafond métabolique de 40 min.`);
      }

      rawSetsAnalysis.forEach(item => {
        if (item.abandoned) {
          optimal = false;
          weaknesses.push(`⛔ ${item.order} ${item.name} : exercice abandonné (0/${item.plannedSets} série validée).`);
          return;
        }
        if (item.partial) {
          optimal = false;
          weaknesses.push(`⚠️ ${item.order} ${item.name} : exercice incomplet (${item.completedCount}/${item.plannedSets} séries validées).`);
        }
        if (item.junkSetsCount > 0) {
          weaknesses.push(`${item.name} : ${item.junkSetsCount} série(s) avec RIR ≥ 3 exclue(s) du volume effectif.`);
        }
        if (item.repDropPct > 20) {
          weaknesses.push(`${item.name} : chute de ${item.repDropPct}% des répétitions entre le 1er et le dernier tour.`);
        }
      });

      // Mise à jour du catalogue et règles de progression par exercice
      loggedExercises.forEach(item => {
        const ex = state.catalog[item.id];
        if (!ex) return;

        const oldWeight = ex.targetWeight;
        const oldSets = ex.targetSets;
        const prevBestE1rm = ex.history.length > 0
          ? Math.max(...ex.history.map(h => h.e1rm))
          : 0;

        item.prevE1rm = prevBestE1rm;

        // Cas 1 : Exercice totalement abandonné (0 série validée) -> pas d'entrée e1RM et ajustement conservateur
        if (item.abandoned) {
          let appliedRule = 'Abandon : maintien charge';
          if (ex.targetWeight > 0 && !state.mesocycleState.deloadActive) {
            ex.targetWeight = roundToHalfKg(ex.targetWeight * 0.95);
            appliedRule = 'Abandon : -5% sécurité';
          }
          nextSessionAdjustments.push({
            exId: ex.id,
            order: ex.order,
            name: ex.name,
            oldWeight,
            newWeight: ex.targetWeight,
            oldSets,
            sets: ex.targetSets,
            rir: ex.targetRir,
            rule: appliedRule
          });
          return;
        }

        // Cas 2 : Exercice partiel (au moins 1 série validée, mais < cible)
        if (item.partial) {
          ex.history.push({
            date: todayStr,
            weight: item.weight,
            reps: item.reps,
            rir: item.rir,
            sets: item.sets,
            e1rm: item.e1rm
          });
          nextSessionAdjustments.push({
            exId: ex.id,
            order: ex.order,
            name: ex.name,
            oldWeight,
            newWeight: ex.targetWeight,
            oldSets,
            sets: ex.targetSets,
            rir: ex.targetRir,
            rule: `Incomplet (${item.sets}/${item.plannedSets}s) : maintien`
          });
          return;
        }

        // Cas 3 : Exercice complet
        ex.history.push({
          date: todayStr,
          weight: item.weight,
          reps: item.reps,
          rir: item.rir,
          sets: item.sets,
          e1rm: item.e1rm
        });

        let appliedRule = 'Maintien cible';

        if (prevBestE1rm > 0 && item.e1rm > prevBestE1rm) {
          const gainPct = Math.round(((item.e1rm - prevBestE1rm) / prevBestE1rm) * 1000) / 10;
          strengths.push(`${ex.order} ${ex.name} : record e1RM à ${item.e1rm} kg (+${gainPct}%).`);
        } else if (prevBestE1rm > 0 && item.e1rm === prevBestE1rm) {
          strengths.push(`${ex.order} ${ex.name} : maintien du pic e1RM (${item.e1rm} kg).`);
        }

        if (state.mesocycleState.deloadActive) {
          appliedRule = 'Deload actif (RIR 3)';
          ex.targetRir = 3;
        } else if (item.reps < ex.minReps && item.rir === 0) {
          // Règle 3 : Sanction d'échec strictement si reps < fourchette basse (minReps) à RIR 0
          // (Un exercice dans [minReps, maxReps] à RIR 0 n'est jamais sanctionné)
          optimal = false;
          weaknesses.push(`${ex.order} ${ex.name} : échec prématuré (${item.reps} reps < ${ex.minReps} cibles à RIR 0).`);
          if (ex.targetWeight > 0) {
            const reduced = roundToHalfKg(ex.targetWeight * 0.95);
            ex.targetWeight = reduced;
            appliedRule = 'Sanction échec -5%';
            diagnostics.push(`Sanction d'échec sur ${ex.order} (${ex.name}) : -5% charge (${reduced}kg).`);
          }
        } else {
          const wk = state.mesocycleState.week;
          if (wk === 1) {
            if (item.e1rm >= prevBestE1rm && ex.targetWeight > 0) {
              const inc = roundToHalfKg(ex.targetWeight * 1.035);
              ex.targetWeight = inc > ex.targetWeight ? inc : ex.targetWeight + 1.5;
              appliedRule = 'Surcharge +3.5%';
            } else {
              appliedRule = 'Consolidation RIR 1';
            }
            ex.targetRir = 1;
          } else if (wk === 2) {
            if (item.e1rm >= prevBestE1rm && ex.targetWeight > 0) {
              const inc = roundToHalfKg(ex.targetWeight * 1.025);
              ex.targetWeight = inc > ex.targetWeight ? inc : ex.targetWeight + 1;
              appliedRule = 'Surcharge +2.5%';
            } else {
              appliedRule = 'Pic intensité RIR 0';
            }
            ex.targetRir = 0;
          } else {
            if (item.reps >= ex.maxReps && ex.targetWeight > 0) {
              ex.targetWeight = roundToHalfKg(ex.targetWeight * 1.025);
              ex.targetRir = 2;
              appliedRule = 'Cycle +2.5% (RIR 2)';
            } else {
              appliedRule = 'Pic +1-2 reps (RIR 0)';
            }
          }
        }

        nextSessionAdjustments.push({
          exId: ex.id,
          order: ex.order,
          name: ex.name,
          oldWeight,
          newWeight: ex.targetWeight,
          oldSets,
          sets: ex.targetSets,
          rir: ex.targetRir,
          rule: appliedRule
        });
      });

      // RÈGLE 1 — Coupe-Circuit Clinique (Douleur Lombaire / SI >= 4/10)
      if (painIndex >= 4) {
        optimal = false;
        state.mesocycleState.clinicalCutActive = true;
        weaknesses.unshift(`Alerte Clinique Sacro-Iliaque / Lombaire (${painIndex}/10 ≥ seuil 4/10).`);

        Object.values(state.catalog).forEach(ex => {
          if (ex.isLowerPosteriorOrAxialSensitive || ex.sessionCode === 'LA' || ex.sessionCode === 'LB') {
            const beforeW = ex.targetWeight;
            const beforeS = ex.targetSets;
            if (ex.targetWeight > 0) {
              ex.targetWeight = roundToHalfKg(ex.targetWeight * 0.85);
            }
            ex.targetSets = Math.max(2, ex.baseSets - 1);

            const existingAdj = nextSessionAdjustments.find(a => a.exId === ex.id);
            if (existingAdj) {
              existingAdj.newWeight = ex.targetWeight;
              existingAdj.sets = ex.targetSets;
              existingAdj.rule = 'Coupe-circuit SI -15% / -1s';
            } else {
              nextSessionAdjustments.push({
                exId: ex.id,
                order: `${ex.sessionCode}·${ex.order}`,
                name: ex.name,
                oldWeight: beforeW,
                newWeight: ex.targetWeight,
                oldSets: beforeS,
                sets: ex.targetSets,
                rir: ex.targetRir,
                rule: 'Coupe-circuit SI -15% / -1s'
              });
            }
          }
        });
        diagnostics.unshift(`⚠️ COUPE-CIRCUIT CLINIQUE ACTIF (Douleur SI/Lombaire ${painIndex}/10) : -15% de charge et -1 série appliqués sur la chaîne postérieure / bas du corps.`);
      } else {
        strengths.push(`Tolérance lombaire & sacro-iliaque validée (${painIndex}/10 < 4/10).`);
        if (state.mesocycleState.clinicalCutActive && painIndex <= 2) {
          state.mesocycleState.clinicalCutActive = false;
          Object.values(state.catalog).forEach(ex => {
            if (!state.mesocycleState.deloadActive) {
              ex.targetSets = ex.baseSets;
            }
          });
          diagnostics.push(`Récupération lombaire confirmée (${painIndex}/10) : restauration du volume nominal.`);
        }
      }

      if (rpeGlobal > 8.5) {
        weaknesses.push(`Fatigue nerveuse élevée (RPE SNC ${rpeGlobal}/10 > 8.5).`);
      }

      const mState = state.mesocycleState;
      if (mState.deloadActive) {
        mState.deloadSessionsRemaining = Math.max(0, (mState.deloadSessionsRemaining || 1) - 1);
        if (mState.deloadSessionsRemaining === 0) {
          mState.deloadActive = false;
          mState.mesocycle = (mState.mesocycle || 1) + 1;
          mState.week = 1;
          mState.sessionsCompletedInMesocycle = 0;
          Object.values(state.catalog).forEach(ex => {
            ex.targetSets = ex.baseSets;
            ex.targetRir = 2;
          });
          diagnostics.push(`🚀 DÉCHARGE TERMINÉE : Lancement automatique du Mésocycle ${mState.mesocycle} — Semaine 1 (Volume nominal, RIR 2).`);
        } else {
          diagnostics.push(`🔄 Semaine de décharge en cours (${mState.deloadSessionsRemaining} séance(s) restante(s) avant le Mésocycle ${(mState.mesocycle || 1) + 1}).`);
        }
      } else {
        mState.sessionsCompletedInMesocycle = (mState.sessionsCompletedInMesocycle || 0) + 1;
        mState.week = Math.max(mState.week || 1, Math.floor((mState.sessionsCompletedInMesocycle - 1) / 4) + 1);
      }

      if (strengths.length === 0) {
        strengths.push('Séance complétée et enregistrée dans la base locale IndexedDB.');
      }

      if (diagnostics.length === 0) {
        diagnostics.push(`Adaptation Markov nominale : Surcharge progressive calculée pour la prochaine séance (${SESSION_TEMPLATES[sessionCode].name}).`);
      }

      const finalDiagnostic = diagnostics.join(' ');
      state.mesocycleState.lastDiagnostic = finalDiagnostic;

      const isFinalOptimal = optimal && rpeGlobal <= 8.5 && painIndex < 4 && weaknesses.length === 0;

      const newLog = {
        id: 'log_' + Date.now(),
        date: todayStr,
        sessionCode,
        sessionName: SESSION_TEMPLATES[sessionCode].name,
        durationSec,
        activeSec,
        restSec,
        transitionSec,
        rpe: rpeGlobal,
        painIndex,
        optimal: isFinalOptimal,
        diagnostic: finalDiagnostic,
        strengths,
        weaknesses,
        nextSessionAdjustments,
        exercisesLogged: loggedExercises,
        mesocycleEndProposal: null
      };

      const existingIdx = state.sessionLogs.findIndex(l => l.date === todayStr && l.sessionCode === sessionCode);
      if (existingIdx >= 0) {
        state.sessionLogs[existingIdx] = newLog;
      } else {
        state.sessionLogs.push(newLog);
      }

      const endProposal = evaluateMesocycleEndSignals(state, state.sessionLogs);
      if (endProposal) {
        state.mesocycleState.pendingEndProposal = endProposal;
        newLog.mesocycleEndProposal = endProposal;
      } else {
        state.mesocycleState.pendingEndProposal = null;
      }

      return newLog;
    }

    /********************************************************************
     * GRAPHIQUE SVG EN DIRECT (HISTORIQUE BLEU + PROJECTION ORANGE)
     ********************************************************************/
    function generateExerciseProgressionSVG(exercise, state) {
      const hist = exercise.history || [];
      const currTargetE1rm = computeE1RM(exercise.targetWeight, exercise.minReps, exercise.targetRir, {
        isTimed: isTimedExercise(exercise),
        bodyweight: state.profile?.weight
      });

      const realPoints = hist.length > 0
        ? hist.slice(-4).map(h => ({
            label: formatShortFrenchDate(h.date),
            val: h.e1rm,
            type: 'real'
          }))
        : [{ label: 'Calibrage', val: currTargetE1rm, type: 'real' }];

      const lastVal = realPoints[realPoints.length - 1].val;
      const growthFactor = state.mesocycleState.clinicalCutActive && exercise.isLowerPosteriorOrAxialSensitive
        ? 0.96
        : (state.mesocycleState.deloadActive ? 1.0 : 1.028);

      const projPoints = [
        { label: 'S+1', val: Math.round(lastVal * growthFactor * 10) / 10, type: 'proj' },
        { label: 'S+2', val: Math.round(lastVal * Math.pow(growthFactor, 2) * 10) / 10, type: 'proj' },
        { label: 'S+3', val: Math.round(lastVal * Math.pow(growthFactor, 3) * 10) / 10, type: 'proj' }
      ];

      const allPoints = [...realPoints, ...projPoints];
      const values = allPoints.map(p => p.val);
      const minVal = Math.min(...values) * 0.94;
      const maxVal = Math.max(...values) * 1.05;
      const range = Math.max(2, maxVal - minVal);

      const width = 360;
      const height = 135;
      const padLeft = 24;
      const padRight = 24;
      const padTop = 26;
      const padBottom = 26;

      const usableW = width - padLeft - padRight;
      const usableH = height - padTop - padBottom;

      const coords = allPoints.map((pt, i) => {
        const x = padLeft + (i / Math.max(1, allPoints.length - 1)) * usableW;
        const y = padTop + usableH - ((pt.val - minVal) / range) * usableH;
        return { ...pt, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
      });

      const realCoords = coords.slice(0, realPoints.length);
      const projCoords = coords.slice(realPoints.length - 1);

      const realPath = realCoords.map((c, i) => `${i === 0 ? 'M' : 'L'}${c.x},${c.y}`).join(' ');
      const projPath = projCoords.map((c, i) => `${i === 0 ? 'M' : 'L'}${c.x},${c.y}`).join(' ');

      return `
        <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:132px;overflow:visible;display:block;">
          <defs>
            <linearGradient id="gradBlue_${exercise.id}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.28"/>
              <stop offset="100%" stop-color="#0a84ff" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <line x1="${padLeft}" y1="${padTop}" x2="${width - padRight}" y2="${padTop}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <line x1="${padLeft}" y1="${padTop + usableH / 2}" x2="${width - padRight}" y2="${padTop + usableH / 2}" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="2 3"/>
          <line x1="${padLeft}" y1="${height - padBottom}" x2="${width - padRight}" y2="${height - padBottom}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

          ${realCoords.length > 1 ? `
            <path d="${realPath} L${realCoords[realCoords.length - 1].x},${height - padBottom} L${realCoords[0].x},${height - padBottom} Z" fill="url(#gradBlue_${exercise.id})"/>
          ` : ''}

          <path d="${realPath}" fill="none" stroke="#0a84ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="${projPath}" fill="none" stroke="#ff9f0a" stroke-width="2.2" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/>

          ${coords.map(c => {
            const isProj = c.type === 'proj';
            const color = isProj ? '#ff9f0a' : '#0a84ff';
            return `
              <g>
                <circle cx="${c.x}" cy="${c.y}" r="${isProj ? 3.5 : 4.2}" fill="#000000" stroke="${color}" stroke-width="2.2"/>
                <text x="${c.x}" y="${c.y - 9}" text-anchor="middle" fill="${isProj ? '#ffb340' : '#ffffff'}" font-size="9.5" font-weight="600">${c.val}</text>

    /********************************************************************
     * GESTIONNAIRE AUDIO (BIPS 5-4-3-2-1s + BIP LONG À 0s) & ÉTAT UI
     ********************************************************************/
    const UIState = {
      state: null,
      currentScreen: 'dashboard',
      selectedMuscle: null,
      calendarYear: new Date().getFullYear(),
      calendarMonth: new Date().getMonth(),
      workoutTimerInterval: null,
      restTimerInterval: null,
      lastBeepedSecond: null,
      animFrameToggle: 0,
      animInterval: null
    };

    function playCountdownTone(isFinalZero = false) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';

        if (isFinalZero) {
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.24, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.72);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.72);
        } else {
          osc.frequency.setValueAtTime(740, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.14);
        }
      } catch (e) {}
    }

    function showToast(message, type = 'info') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const borderCol = type === 'success' ? '#30d158' : (type === 'warning' ? '#ff9f0a' : '#0a84ff');
      root.innerHTML = `
        <div class="ios-glass" style="border:1px solid ${borderCol};padding:11px 14px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.6);display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;color:#fff;">
          <span style="width:8px;height:8px;border-radius:999px;flex-shrink:0;background:${borderCol};"></span>
          <span class="leading-snug">${message}</span>
        </div>
      `;
      clearTimeout(UIState._toastTimeout);
      UIState._toastTimeout = setTimeout(() => {
        if (root) root.innerHTML = '';
      }, 3600);
    }

    /********************************************************************
     * PERSISTANCE, TIMERS & FENÊTRE FLOTTANTE DE REPOS
     ********************************************************************/
    function getActiveElapsedSec() {
      const act = UIState.state?.activeSession;
      if (!act || !act.startedAt) return 0;
      return Math.max(0, Math.floor((Date.now() - act.startedAt) / 1000));
    }

    function getRestRemainingSec() {
      const act = UIState.state?.activeSession;
      if (!act || !act.restEndAt) return 0;
      return Math.max(0, Math.ceil((act.restEndAt - Date.now()) / 1000));
    }

    function updateFloatingRestOverlay(remSec, totalSec, contextLabel) {
      const overlay = document.getElementById('floating-rest-overlay');
      const clockEl = document.getElementById('float-rest-clock');
      const barEl = document.getElementById('float-rest-bar');
      const labelEl = document.getElementById('float-rest-label');
      const dotEl = document.getElementById('float-rest-dot');
      const backBtn = document.getElementById('float-rest-back-btn');
      if (!overlay || !clockEl || !barEl) return;

      const act = UIState.state?.activeSession;
      const appShell = document.getElementById('app');
      if (!act || remSec <= 0) {
        overlay.style.display = 'none';
        if (appShell) appShell.classList.remove('has-floating-rest');
        return;
      }

      overlay.style.display = 'block';
      if (appShell) appShell.classList.add('has-floating-rest');
      const isUrgent = remSec <= 5;
      const accentColor = isUrgent ? '#ff9f0a' : '#0a84ff';

      overlay.style.borderColor = isUrgent ? 'rgba(255,159,10,0.65)' : 'rgba(10,132,255,0.55)';
      clockEl.textContent = formatMMSS(remSec);
      clockEl.style.color = accentColor;
      if (dotEl) dotEl.style.background = accentColor;
      if (labelEl) labelEl.textContent = contextLabel || 'Repos en cours';

      const pct = Math.min(100, Math.round((remSec / Math.max(1, totalSec)) * 100));
      barEl.style.width = `${pct}%`;
      barEl.style.background = accentColor;

      if (backBtn) {
        backBtn.style.display = UIState.currentScreen !== 'workout' ? 'inline-block' : 'none';
      }
    }

    function ensureWorkoutLoopsRunning() {
      if (UIState.workoutTimerInterval) clearInterval(UIState.workoutTimerInterval);
      UIState.workoutTimerInterval = setInterval(() => {
        const act = UIState.state?.activeSession;
        if (!act) return;
        const elapsed = getActiveElapsedSec();

        const liveEl = document.getElementById('live-workout-elapsed');
        if (liveEl) liveEl.textContent = formatMMSS(elapsed);
        const dashResumeEl = document.getElementById('dash-resume-elapsed');
        if (dashResumeEl) dashResumeEl.textContent = formatMMSS(elapsed);
      }, 1000);

      if (UIState.restTimerInterval) clearInterval(UIState.restTimerInterval);
      UIState.restTimerInterval = setInterval(() => {
        const act = UIState.state?.activeSession;
        if (!act || !act.restEndAt) {
          updateRestTimerDOM(0, 0, '');
          updateFloatingRestOverlay(0, 0, '');
          return;
        }

        const rem = getRestRemainingSec();
        updateRestTimerDOM(rem, act.restTotalSec || 120, act.restContextLabel || '');
        updateFloatingRestOverlay(rem, act.restTotalSec || 120, act.restContextLabel || '');

        if (rem >= 1 && rem <= 5 && UIState.lastBeepedSecond !== rem) {
          UIState.lastBeepedSecond = rem;
          playCountdownTone(false);
        } else if (rem === 0 && UIState.lastBeepedSecond !== 0) {
          UIState.lastBeepedSecond = 0;
          playCountdownTone(true);
          if (act.restStartedAt) {
            const elapsed = Math.max(0, Math.round((Date.now() - act.restStartedAt) / 1000));
            act.cumulativeRestSec = (act.cumulativeRestSec || 0) + elapsed;
            if ((act.restContextLabel || '').includes('Transition')) {
              act.cumulativeTransitionSec = (act.cumulativeTransitionSec || 0) + elapsed;
            }
          }
          act.restStartedAt = null;
          act.restEndAt = null;
          act.restContextLabel = '';
          updateFloatingRestOverlay(0, 0, '');
          DB.saveState(UIState.state);
          showToast('Fin du temps de repos — Enchaînez le tour suivant.', 'success');
        }
      }, 250);

      if (UIState.animInterval) clearInterval(UIState.animInterval);
      UIState.animInterval = setInterval(() => {
        UIState.animFrameToggle = UIState.animFrameToggle === 0 ? 1 : 0;
        updateAllBiomechanicalFrames();
      }, 1600);
    }

    async function startRestCountdown(seconds, contextLabel = 'Repos manuel') {
      const act = UIState.state?.activeSession;
      if (!act) return;
      UIState.lastBeepedSecond = null;

      if (act.restStartedAt) {
        const alreadyElapsed = Math.max(0, Math.round((Date.now() - act.restStartedAt) / 1000));
        act.cumulativeRestSec = (act.cumulativeRestSec || 0) + alreadyElapsed;
        if ((act.restContextLabel || '').includes('Transition')) {
          act.cumulativeTransitionSec = (act.cumulativeTransitionSec || 0) + alreadyElapsed;
        }
      }

      act.restTotalSec = seconds;
      act.restStartedAt = Date.now();
      act.restEndAt = Date.now() + (seconds * 1000);
      act.restContextLabel = contextLabel;
      await DB.saveState(UIState.state);
      updateRestTimerDOM(seconds, seconds, contextLabel);
      updateFloatingRestOverlay(seconds, seconds, contextLabel);
    }

    async function adjustRestTimer(deltaSec) {
      const act = UIState.state?.activeSession;
      if (!act) return;
      if (deltaSec === 0) {
        if (act.restStartedAt) {
          const actualElapsed = Math.max(0, Math.round((Date.now() - act.restStartedAt) / 1000));
          act.cumulativeRestSec = (act.cumulativeRestSec || 0) + actualElapsed;
          if ((act.restContextLabel || '').includes('Transition')) {
            act.cumulativeTransitionSec = (act.cumulativeTransitionSec || 0) + actualElapsed;
          }
        }
        act.restStartedAt = null;
        act.restEndAt = null;
        act.restContextLabel = '';
        UIState.lastBeepedSecond = null;
      } else {
        const currentRem = getRestRemainingSec();
        const nextRem = Math.max(0, currentRem + deltaSec);
        if (nextRem === 0) {
          if (act.restStartedAt) {
            const actualElapsed = Math.max(0, Math.round((Date.now() - act.restStartedAt) / 1000));
            act.cumulativeRestSec = (act.cumulativeRestSec || 0) + actualElapsed;
            if ((act.restContextLabel || '').includes('Transition')) {
              act.cumulativeTransitionSec = (act.cumulativeTransitionSec || 0) + actualElapsed;
            }
          }
          act.restStartedAt = null;
          act.restEndAt = null;
          act.restContextLabel = '';
          UIState.lastBeepedSecond = null;
        } else {
          if (!act.restStartedAt) act.restStartedAt = Date.now();
          act.restEndAt = Date.now() + (nextRem * 1000);
          act.restTotalSec = Math.max(act.restTotalSec || 90, nextRem);
        }
      }
      await DB.saveState(UIState.state);
      const rem = getRestRemainingSec();
      updateRestTimerDOM(rem, act.restTotalSec || 120, act.restContextLabel || '');
      updateFloatingRestOverlay(rem, act.restTotalSec || 120, act.restContextLabel || '');
    }

    function updateRestTimerDOM(remSec, totalSec, contextLabel) {
      const valEl = document.getElementById('rest-timer-val');
      const barEl = document.getElementById('rest-timer-bar');
      const badgeEl = document.getElementById('rest-context-badge');
      if (!valEl || !barEl) return;

      if (badgeEl) {
        if (remSec > 0 && contextLabel) {
          badgeEl.textContent = contextLabel;
          badgeEl.style.display = 'inline-block';
        } else {
          badgeEl.style.display = 'none';
        }
      }

      if (remSec > 0) {
        valEl.textContent = `Repos : ${formatMMSS(remSec)}`;
        valEl.style.color = remSec <= 5 ? '#ff9f0a' : '#0a84ff';
        const pct = Math.min(100, Math.round((remSec / Math.max(1, totalSec)) * 100));
        barEl.style.width = `${pct}%`;
        barEl.style.background = remSec <= 5 ? '#ff9f0a' : '#0a84ff';
      } else {
        valEl.textContent = 'Prêt (00:00)';
        valEl.style.color = '#30d158';
        barEl.style.width = '0%';
      }
    }

    async function initOrResumeWorkout(sessionCode) {
      const st = UIState.state;
      if (st.activeSession && st.activeSession.sessionCode === sessionCode) {
        ensureWorkoutLoopsRunning();
        return;
      }

      const sess = SESSION_TEMPLATES[sessionCode];
      const setsState = {};

      if (sess.isCalibrationSession) {
        sess.exercises.forEach(exId => {
          const ex = st.catalog[exId];
          const wTop = ex.targetWeight;
          const wWarm1 = wTop > 0 ? roundToTwoHalfKg(wTop * 0.5) : 0;
          const wWarm2 = wTop > 0 ? roundToTwoHalfKg(wTop * 0.75) : 0;
          setsState[exId] = [
            { setNum: 1, isWarmup: true,  label: 'Échauff. 1 (50%)', weight: wWarm1, reps: 10, rir: 4, completed: false },
            { setNum: 2, isWarmup: true,  label: 'Échauff. 2 (75%)', weight: wWarm2, reps: 6,  rir: 3, completed: false },
            { setNum: 3, isWarmup: false, label: 'TOP SET (6-10 reps)', weight: wTop, reps: 8, rir: 0, localPain: 0, completed: false }
          ];
        });
      } else {
        sess.exercises.forEach(exId => {
          const ex = st.catalog[exId];
          const setsArr = [];
          for (let s = 1; s <= ex.targetSets; s++) {
            setsArr.push({
              setNum: s,
              weight: ex.targetWeight,
              reps: ex.minReps + Math.floor((ex.maxReps - ex.minReps) / 2),
              rir: ex.targetRir,
              completed: false
            });
          }
          setsState[exId] = setsArr;
        });
      }

      st.activeSession = {
        sessionCode,
        isCalibrationSession: !!sess.isCalibrationSession,
        startedAt: Date.now(),
        restStartedAt: null,
        restEndAt: null,
        restTotalSec: 120,
        restContextLabel: '',
        cumulativeRestSec: 0,
        cumulativeTransitionSec: 0,
        setsState
      };

      await DB.saveState(st);
      ensureWorkoutLoopsRunning();
    }

      UIState.currentScreen = screen;

        initOrResumeWorkout(param).then(() => renderApp());

      window.scrollTo({ top: 0, behavior: 'smooth' });

    // ÉCRAN 3 : CALENDRIER & HISTORIQUE
    function renderCalendarScreen() {
      const st = UIState.state;
      const year = UIState.calendarYear;
      const month = UIState.calendarMonth;

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startOffset = (firstDay.getDay() + 6) % 7;

      const monthLabel = firstDay.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const rolling = computeWeeklyRollingSchedule(st);
      const todayStr = rolling.todayStr;

      const logsByDate = {};
      st.sessionLogs.forEach(l => {
        logsByDate[l.date] = l;
      });

      const cells = [];
      for (let i = 0; i < startOffset; i++) {
        cells.push(`<div style="height:54px;"></div>`);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dtStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = dtStr === todayStr;
        const log = logsByDate[dtStr];
        const sched = rolling.scheduleMap[dtStr];

        let bottomBorder = '3px solid transparent';
        let badgeCode = '';
        let badgeColor = '#8e8e93';
        let cellBg = '#121212';

        if (log) {
          badgeCode = log.sessionCode.startsWith('CAL_') ? 'CAL' : log.sessionCode;
          if (log.optimal) {
            bottomBorder = '3px solid #30d158';
            badgeColor = '#30d158';
          } else {
            bottomBorder = '3px solid #ff9f0a';
            badgeColor = '#ff9f0a';
          }
        } else if (sched && sched.type === 'scheduled') {
          badgeCode = sched.sessionCode;
          bottomBorder = '3px solid #0a84ff';
          badgeColor = '#0a84ff';
          if (sched.shifted) cellBg = 'rgba(10,132,255,0.12)';
        }

        const borderBox = isToday ? '1.5px solid #ffffff' : '1px solid rgba(255,255,255,0.06)';

        cells.push(`
          <button onclick="openCalendarDateSheet('${dtStr}')" class="btn-active flex flex-col justify-between items-center" style="height:54px;border-radius:12px;background:${cellBg};border:${borderBox};border-bottom:${bottomBorder};padding:6px 4px;">
            <span style="font-size:11px;font-weight:${isToday ? '700' : '500'};color:${isToday ? '#fff' : '#8e8e93'};">${d}</span>
            ${badgeCode ? `<span style="font-size:10px;font-weight:700;color:${badgeColor};">${badgeCode}</span>` : `<span style="font-size:9px;color:#3a3a3c;">•</span>`}

      bottomBar.innerHTML = `
        <button onclick="navigateTo('dashboard')" class="btn-active w-full" style="padding:13px;border-radius:16px;background:#1c1c1e;border:1px solid rgba(255,255,255,0.1);color:#fff;font-weight:600;font-size:14px;">

    function changeCalendarMonth(delta) {
      let m = UIState.calendarMonth + delta;
      let y = UIState.calendarYear;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      UIState.calendarMonth = m;
      UIState.calendarYear = y;
      renderCalendarScreen();
    }

    async function simulateRollingShift(mode) {
      const st = UIState.state;
      if (mode === 0) {
        st.mesocycleState.simulatedMissedDays = 0;
        showToast('Calendrier glissant recalé sur la date réelle.', 'info');
      } else {
        st.mesocycleState.simulatedMissedDays = Math.min(4, (st.mesocycleState.simulatedMissedDays || 0) + 1);
        showToast(`Simulation : +${st.mesocycleState.simulatedMissedDays}j sans séance. Décalage auto vers Samedi/Dimanche.`, 'warning');
      }
      await DB.saveState(st);
      renderCalendarScreen();
    }

    /********************************************************************
     * ÉCRAN 4 : VUE ENTRAÎNEMENT ACTIF & MICRO-SÉANCES DE CALIBRATION
     ********************************************************************/
    function updateAllBiomechanicalFrames() {
      if (UIState.currentScreen !== 'workout') return;
      const act = UIState.state?.activeSession;
      if (!act) return;
      const sess = SESSION_TEMPLATES[act.sessionCode];
      if (!sess) return;
      sess.exercises.forEach(exId => {
        const container = document.getElementById(`svg-frame-${exId}`);
        const badge = document.getElementById(`badge-frame-${exId}`);
        if (container) {
          container.innerHTML = getExerciseTwoFrameSVG(exId, UIState.animFrameToggle);
        }
        if (badge) {
          badge.textContent = UIState.animFrameToggle === 0 ? 'Phase 1 : Départ' : 'Phase 2 : Contraction';
        }
      });
    }

    function buildWorkoutBlocks(sess, catalog) {
      const blocks = [];
      const visited = new Set();

      if (sess.isCalibrationSession) {
        sess.exercises.forEach(exId => {
          const ex = catalog[exId];
          if (ex) {
            blocks.push({
              type: 'single',
              blockCode: ex.order,
              items: [ex]
            });
          }
        });
        return blocks;
      }

      sess.exercises.forEach(exId => {
        if (visited.has(exId)) return;
        const ex = catalog[exId];
        if (ex.supersetGroup && ex.supersetPartner && catalog[ex.supersetPartner]) {
          visited.add(exId);
          visited.add(ex.supersetPartner);
          blocks.push({
            type: 'superset',
            blockCode: ex.blockCode || ex.supersetGroup,
            groupName: ex.supersetGroup,
            items: [ex, catalog[ex.supersetPartner]]
          });
        } else {
          visited.add(exId);
          blocks.push({
            type: 'single',
            blockCode: ex.blockCode || ex.order,
            items: [ex]
          });
        }
      });
      return blocks;
    }

            ? (allCompleted ? '🎯 Calibration terminée — Calculer mes charges ›' : 'Valider le Test de Calibration ›')

    function rerenderWorkoutPreservingScroll() {
      const y = window.scrollY;
      renderWorkoutScreen();
      if (Math.abs(window.scrollY - y) > 2) {
        window.scrollTo(0, y);
      }
    }

    function setCalibrationLocalPain(exId, setIdx, painVal) {
      const act = UIState.state?.activeSession;
      if (!act || !act.setsState[exId] || !act.setsState[exId][setIdx]) return;
      act.setsState[exId][setIdx].localPain = painVal;
      rerenderWorkoutPreservingScroll();
      DB.scheduleSave(UIState.state);
    }

    function updateSetValue(exId, setIdx, field, delta) {
      const act = UIState.state?.activeSession;
      if (!act || !act.setsState[exId] || !act.setsState[exId][setIdx]) return;
      const item = act.setsState[exId][setIdx];
      if (field === 'weight') {
        item.weight = Math.max(0, roundToHalfKg(item.weight + delta));
      } else if (field === 'reps') {
        item.reps = Math.max(1, item.reps + delta);
      }
      rerenderWorkoutPreservingScroll();
      DB.scheduleSave(UIState.state);
    }

    function setSetRir(exId, setIdx, rirVal) {
      const act = UIState.state?.activeSession;
      if (!act || !act.setsState[exId] || !act.setsState[exId][setIdx]) return;
      act.setsState[exId][setIdx].rir = rirVal;
      rerenderWorkoutPreservingScroll();
      DB.scheduleSave(UIState.state);
    }

    async function toggleCompleteSet(exId, setIdx) {
      const st = UIState.state;
      const act = st.activeSession;
      if (!act || !act.setsState[exId] || !act.setsState[exId][setIdx]) return;

      const ex = st.catalog[exId];
      const currentSet = act.setsState[exId][setIdx];
      currentSet.completed = !currentSet.completed;

      if (currentSet.completed) {
        const sess = SESSION_TEMPLATES[act.sessionCode];
        const blocks = buildWorkoutBlocks(sess, st.catalog);
        const blockIdx = blocks.findIndex(b => b.items.some(it => it.id === exId));
        const currentBlock = blocks[blockIdx];
        const hasNextBlock = blockIdx >= 0 && blockIdx < blocks.length - 1;

        if (!sess.isCalibrationSession && ex.supersetPartner && act.setsState[ex.supersetPartner]) {
          const partnerSet = act.setsState[ex.supersetPartner][setIdx];
          const partnerEx = st.catalog[ex.supersetPartner];
          const totalRounds = Math.max(act.setsState[exId].length, act.setsState[ex.supersetPartner].length);
          const isLastRoundOfBlock = setIdx >= totalRounds - 1;

          if (partnerSet && !partnerSet.completed) {
            showToast(`${ex.order} validé ! Enchaînez immédiatement avec ${partnerEx.order} (pas de repos).`, 'info');
          } else {
            if (!isLastRoundOfBlock) {
              const restSec = currentBlock?.blockCode === 'A' ? 120 : 90;
              const label = currentBlock?.blockCode === 'A'
                ? 'Repos intra-bloc A · 120s'
                : 'Repos intra-bloc · 90s';
              await startRestCountdown(restSec, label);
              showToast(`Tour ${setIdx + 1} complet ! ${label}.`, 'success');
            } else if (hasNextBlock) {
              await startRestCountdown(150, 'Transition bloc suivant · 150s');
              showToast(`Superset ${ex.supersetGroup} terminé ! Transition bloc suivant · 150s.`, 'success');
            } else {
              await adjustRestTimer(0);
              showToast('Dernier tour de la séance validé ! Clôturez pour voir votre bilan.', 'success');
              setTimeout(() => {
                document.getElementById('btn-finish-workout')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }, 200);
            }
          }
        } else {
          const totalSets = act.setsState[exId].length;
          const isLastSetOfBlock = setIdx >= totalSets - 1;

          if (!isLastSetOfBlock) {
            const isWarmupSet = !!currentSet.isWarmup;
            const restSec = isWarmupSet ? 60 : (currentBlock?.blockCode === 'A' ? 120 : 90);
            const label = isWarmupSet
              ? 'Repos échauffement · 60s'
              : (currentBlock?.blockCode === 'A' ? 'Repos intra-bloc A · 120s' : 'Repos intra-bloc · 90s');
            await startRestCountdown(restSec, label);
            showToast(`Série ${setIdx + 1} validée · ${label}.`, 'success');
          } else if (hasNextBlock) {
            await startRestCountdown(150, 'Transition bloc suivant · 150s');
            showToast(`Bloc ${ex.order} terminé · Transition bloc suivant · 150s.`, 'success');
          } else {
            await adjustRestTimer(0);
            showToast('Dernière série de la séance validée ! Clôturez pour voir votre bilan.', 'success');
            setTimeout(() => {
              document.getElementById('btn-finish-workout')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 200);
          }
        }
      }

      rerenderWorkoutPreservingScroll();
      DB.scheduleSave(st);
    }

      } else {
