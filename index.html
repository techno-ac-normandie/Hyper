    async function confirmAndSaveWorkoutSession() {
      const painIndex = parseInt(document.getElementById('input-pain-index')?.value || '1', 10);
      const rpeGlobal = parseFloat(document.getElementById('input-rpe-global')?.value || '7.5');

      const st = UIState.state;
      const act = st.activeSession;
      if (!act) return;

      const sess = SESSION_TEMPLATES[act.sessionCode];
      const loggedExercises = [];
      const rawSetsAnalysis = [];

      // Clôturer un éventuel repos en cours au moment de la validation
      if (act.restStartedAt) {
        const extraRest = Math.max(0, Math.round((Date.now() - act.restStartedAt) / 1000));
        act.cumulativeRestSec = (act.cumulativeRestSec || 0) + extraRest;
        if ((act.restContextLabel || '').includes('Transition')) {
          act.cumulativeTransitionSec = (act.cumulativeTransitionSec || 0) + extraRest;
        }
        act.restStartedAt = null;
        act.restEndAt = null;
      }

      // CAS SPÉCIFIQUE : MICRO-SÉANCE DE CALIBRATION SUB-MAXIMALE
      if (sess.isCalibrationSession) {
        const todayStr = formatDateISO(new Date());
        const strengths = [];
        const weaknesses = [];
        const adjustments = [];
        let maxLocalPain = painIndex;

        sess.exercises.forEach(exId => {
          const ex = st.catalog[exId];
          const setsArr = act.setsState[exId] || [];
          const topSet = setsArr[setsArr.length - 1];
          const isValidated = topSet && topSet.completed;

          if (!isValidated) {
            weaknesses.push(`⛔ ${ex.name} : Top Set non validé (test ignoré).`);
            loggedExercises.push({
              id: ex.id,
              name: ex.name,
              sets: 0,
              plannedSets: 1,
              reps: 0,
              weight: ex.targetWeight,
              rir: 0,
              e1rm: 0,
              hardSets: 0,
              tonnage: 0,
              abandoned: true,
              partial: false
            });
            return;
          }

          const localPain = parseInt(topSet.localPain || 0, 10);
          maxLocalPain = Math.max(maxLocalPain, localPain);
          const e1rmVal = computeE1RM(topSet.weight, topSet.reps, 0);

          ex.calibratedE1rm = e1rmVal;
          ex.calibrated = true;
          ex.history.push({
            date: todayStr,
            weight: topSet.weight,
            reps: topSet.reps,
            rir: 0,
            sets: 1,
            e1rm: e1rmVal
          });

          if (localPain >= 4) {
            weaknesses.push(`⚠️ ${ex.name} : douleur locale signalée (${localPain}/10) → charge Semaine 1 réduite de -15% par sécurité.`);
          } else {
            strengths.push(`✓ ${ex.name} : Top Set ${topSet.reps} reps @ ${topSet.weight} kg → e1RM calibré à ${e1rmVal} kg (Douleur ${localPain}/10).`);
          }

          loggedExercises.push({
            id: ex.id,
            name: ex.name,
            sets: 1,
            plannedSets: 1,
            reps: topSet.reps,
            weight: topSet.weight,
            rir: 0,
            e1rm: e1rmVal,
            hardSets: 1,
            tonnage: topSet.weight * topSet.reps,
            abandoned: false,
            partial: false
          });
        });

        applyCalibratedWeightsToAllExercises(st);

        sess.exercises.forEach(exId => {
          const ex = st.catalog[exId];
          const setsArr = act.setsState[exId] || [];
          const topSet = setsArr[setsArr.length - 1];
          const localPain = parseInt(topSet?.localPain || 0, 10);
          if (localPain >= 4 && ex.targetWeight > 0) {
            ex.targetWeight = roundToHalfKg(ex.targetWeight * 0.85);
            ex.baseWeight = ex.targetWeight;
          }
          adjustments.push({
            exId: ex.id,
            order: ex.order,
            name: ex.name,
            oldWeight: topSet?.weight || ex.targetWeight,
            newWeight: ex.targetWeight,
            oldSets: ex.targetSets,
            sets: ex.targetSets,
            rir: ex.targetRir,
            rule: localPain >= 4 ? 'Calibré + Coupe-circuit -15%' : `Semaine 1 (e1RM ${ex.calibratedE1rm || 0}kg)`
          });
        });

        const mState = st.mesocycleState;
        if (!Array.isArray(mState.calibratedSessions)) mState.calibratedSessions = [];
        if (!mState.calibratedSessions.includes(sess.code)) {
          mState.calibratedSessions.push(sess.code);
        }

        const bothDone = mState.calibratedSessions.includes('CAL_U') && mState.calibratedSessions.includes('CAL_L');
        if (bothDone) {
          mState.calibrationMode = false;
          mState.week = 1;
          mState.sessionsCompletedInMesocycle = 0;
          mState.lastDiagnostic = '🎉 Calibration complète (Upper + Lower) : Toutes les charges Semaine 1 sont calculées. Le Mésocycle 1 peut démarrer.';
        } else {
          const remaining = !mState.calibratedSessions.includes('CAL_U') ? 'Calibration 1/2 : Test Upper' : 'Calibration 2/2 : Test Lower';
          mState.lastDiagnostic = `🎯 ${sess.name} validée ! Prochaine étape : ${remaining} (ou démarrez directement Semaine 1).`;
        }

        const realElapsedSec = Math.max(1, getActiveElapsedSec());
        let estimatedTUTSec = 0;
        sess.exercises.forEach(exId => {
          const ex = st.catalog[exId];
          const timed = isTimedExercise(ex);
          (act.setsState[exId] || []).filter(s => s.completed).forEach(s => {
            estimatedTUTSec += timed ? (s.reps * 2) : Math.round(s.reps * 3.5);
          });
        });

        const measuredTransSec = Math.min(realElapsedSec, act.cumulativeTransitionSec || 0);
        const measuredRestOnly = Math.max(0, (act.cumulativeRestSec || 0) - measuredTransSec);
        const restSec = Math.min(Math.max(0, realElapsedSec - measuredTransSec), measuredRestOnly);
        const remainingForActiveOrIdle = Math.max(0, realElapsedSec - restSec - measuredTransSec);
        const activeSec = Math.min(remainingForActiveOrIdle, estimatedTUTSec > 0 ? estimatedTUTSec : remainingForActiveOrIdle);
        const transitionSec = measuredTransSec + Math.max(0, remainingForActiveOrIdle - activeSec);

        if (UIState.workoutTimerInterval) clearInterval(UIState.workoutTimerInterval);
        if (UIState.restTimerInterval) clearInterval(UIState.restTimerInterval);

        const calLog = {
          id: 'log_' + Date.now(),
          date: todayStr,
          sessionCode: sess.code,
          sessionName: sess.name,
          durationSec: realElapsedSec,
          activeSec,
          restSec,
          transitionSec,
          rpe: rpeGlobal,
          painIndex: maxLocalPain,
          optimal: maxLocalPain < 4 && weaknesses.length === 0,
          diagnostic: mState.lastDiagnostic,
          strengths: strengths.length > 0 ? strengths : ['Calibration enregistrée.'],
          weaknesses,
          nextSessionAdjustments: adjustments,
          exercisesLogged: loggedExercises,
          mesocycleEndProposal: null
        };

        st.sessionLogs.push(calLog);
        st.activeSession = null;
        updateFloatingRestOverlay(0, 0, '');
        await DB.saveState(st);
        openPostWorkoutSummaryModal(calLog);
        return;
      }

      // CAS STANDARD : SÉANCE DU MÉSOCYCLE
      let estimatedTUTSec = 0;
      sess.exercises.forEach(exId => {
        const ex = st.catalog[exId];
        const timed = isTimedExercise(ex);
        const setsArr = act.setsState[exId] || [];
        const completedSets = setsArr.filter(s => s.completed);
        const isAbandoned = completedSets.length === 0;
        const isPartial = !isAbandoned && completedSets.length < setsArr.length;

        completedSets.forEach(s => {
          estimatedTUTSec += timed ? (s.reps * 2) : Math.round(s.reps * 3.5);
        });

        rawSetsAnalysis.push({
          id: ex.id,
          order: ex.order,
          name: ex.name,
          abandoned: isAbandoned,
          partial: isPartial,
          completedCount: completedSets.length,
          plannedSets: setsArr.length,
          junkSetsCount: completedSets.filter(s => s.rir > 3).length,
          repDropPct: (completedSets.length > 1 && completedSets[0].reps > 0)
            ? Math.max(0, Math.round(((completedSets[0].reps - completedSets[completedSets.length - 1].reps) / completedSets[0].reps) * 100))
            : 0
        });

        if (isAbandoned) {
          loggedExercises.push({
            id: ex.id,
            name: ex.name,
            sets: 0,
            plannedSets: setsArr.length,
            reps: 0,
            weight: ex.targetWeight,
            rir: ex.targetRir,
            e1rm: 0,
            hardSets: 0,
            tonnage: 0,
            abandoned: true,
            partial: false
          });
          return;
        }

        const bestSet = completedSets.reduce((best, curr) => {
          const eCurr = computeE1RM(curr.weight, curr.reps, curr.rir, { isTimed: timed, bodyweight: st.profile?.weight });
          const eBest = computeE1RM(best.weight, best.reps, best.rir, { isTimed: timed, bodyweight: st.profile?.weight });
          return eCurr >= eBest ? curr : best;
        }, completedSets[0]);

        const hardSetsCount = completedSets.filter(s => s.rir <= 3).length;
        const tonnage = completedSets.reduce((acc, s) => acc + ((s.weight || 0) * (s.reps || 0)), 0);

        loggedExercises.push({
          id: ex.id,
          name: ex.name,
          sets: completedSets.length,
          plannedSets: setsArr.length,
          reps: bestSet.reps,
          weight: bestSet.weight,
          rir: bestSet.rir,
          e1rm: computeE1RM(bestSet.weight, bestSet.reps, bestSet.rir, { isTimed: timed, bodyweight: st.profile?.weight }),
          isTimed: timed,
          hardSets: hardSetsCount,
          tonnage,
          abandoned: false,
          partial: isPartial
        });
      });

      const realElapsedSec = Math.max(1, getActiveElapsedSec());
      const durationSec = realElapsedSec;
      const measuredTransSec = Math.min(durationSec, act.cumulativeTransitionSec || 0);
      const measuredRestOnly = Math.max(0, (act.cumulativeRestSec || 0) - measuredTransSec);
      const restSec = Math.min(Math.max(0, durationSec - measuredTransSec), measuredRestOnly);
      const remainingForActiveOrIdle = Math.max(0, durationSec - restSec - measuredTransSec);
      // Le temps actif correspond au temps sous tension réel estimé (borné au temps disponible) ;
      // le temps hors-chrono (installations, pauses non chronométrées) est imputé aux transitions.
      const activeSec = Math.min(remainingForActiveOrIdle, estimatedTUTSec);
      const transitionSec = measuredTransSec + Math.max(0, remainingForActiveOrIdle - activeSec);

      if (UIState.workoutTimerInterval) clearInterval(UIState.workoutTimerInterval);
      if (UIState.restTimerInterval) clearInterval(UIState.restTimerInterval);

      const newLog = applyMarkovPostSession(
        st,
        sess.code,
        {
          loggedExercises,
          durationSec,
          activeSec,
          restSec,
          transitionSec,
          rawSetsAnalysis
        },
        rpeGlobal,
        painIndex
      );

      st.activeSession = null;
      updateFloatingRestOverlay(0, 0, '');
      await DB.saveState(st);

      openPostWorkoutSummaryModal(newLog);
    }

    // ÉCRAN DE BILAN VISUEL POST-SÉANCE
    function openPostWorkoutSummaryModal(log) {
      const root = document.getElementById('modal-root');
      root.style.pointerEvents = 'auto';

      const totalSec = Math.max(1, log.durationSec || 1);
      const activeSec = Math.max(0, log.activeSec !== undefined ? log.activeSec : Math.round(totalSec * 0.32));
      const transitionSec = Math.max(0, log.transitionSec !== undefined ? log.transitionSec : 0);
      const restSec = Math.max(0, log.restSec !== undefined ? log.restSec : Math.max(0, totalSec - activeSec - transitionSec));
      const sumParts = Math.max(1, activeSec + restSec + transitionSec);

      const rawPcts = [
        (activeSec / sumParts) * 100,
        (restSec / sumParts) * 100,
        (transitionSec / sumParts) * 100
      ];
      const floors = rawPcts.map(p => Math.floor(p));
      let remainder = 100 - floors.reduce((a, b) => a + b, 0);
      const order = rawPcts
        .map((p, idx) => ({ idx, frac: p - floors[idx] }))
        .sort((a, b) => b.frac - a.frac);
      for (let i = 0; i < remainder; i++) {
        floors[order[i].idx] += 1;
      }
      const [activePct, restPct, transPct] = floors;

      const totalHardSets = (log.exercisesLogged || []).reduce((acc, e) => acc + (e.hardSets ?? e.sets), 0);
      const totalAllSets = (log.exercisesLogged || []).reduce((acc, e) => acc + (e.plannedSets ?? e.sets), 0);
      const totalTonnage = Math.round((log.exercisesLogged || []).reduce((acc, e) => acc + (e.tonnage || (e.weight * e.reps * e.sets)), 0));
      const durMin = Math.round(totalSec / 60);

      let statusLabel = 'SÉANCE OPTIMALE';
      let statusStyle = 'background:rgba(48,209,88,0.18);color:#30d158;border:1px solid rgba(48,209,88,0.4);';
      if (log.sessionCode && log.sessionCode.startsWith('CAL_')) {
        statusLabel = 'CALIBRATION VALIDÉE';
        statusStyle = 'background:rgba(191,90,242,0.18);color:#bf5af2;border:1px solid rgba(191,90,242,0.4);';
      } else if (log.painIndex >= 4) {
        statusLabel = 'ALERTE CLINIQUE SI';
        statusStyle = 'background:rgba(255,69,58,0.18);color:#ff453a;border:1px solid rgba(255,69,58,0.4);';
      } else if (!log.optimal) {
        statusLabel = 'SOUS-OPTIMALE';
        statusStyle = 'background:rgba(255,159,10,0.18);color:#ff9f0a;border:1px solid rgba(255,159,10,0.4);';
      }

      const densityScore = Math.min(100, Math.max(40, Math.round((totalHardSets / Math.max(16, durMin)) * 185)));

      const strengths = log.strengths && log.strengths.length > 0
        ? log.strengths
        : ['Séance validée et enregistrée dans IndexedDB.'];
      const weaknesses = log.weaknesses || [];
      const adjustments = log.nextSessionAdjustments || [];
      // N'afficher la bannière interactive de fin de mésocycle que si une proposition est actuellement en attente
      const activePending = UIState.state?.mesocycleState?.pendingEndProposal;
      const endProposal = activePending ? (log.mesocycleEndProposal || activePending) : null;

      root.innerHTML = `
        <div style="position:fixed;inset:0;background:#000000;display:flex;justify-content:center;overflow-y:auto;" class="backdrop-animate">
          <div style="width:100%;max-width:430px;min-height:100dvh;background:#000000;padding:max(16px,var(--safe-top)) 16px max(24px,var(--safe-bottom)) 16px;display:flex;flex-direction:column;justify-content:space-between;" class="space-y-4">

            <div class="space-y-4">
              <div class="ios-card space-y-2" style="padding:14px;">
                <div class="flex items-center justify-between gap-2">
                  <span style="padding:3px 8px;border-radius:7px;font-size:10px;font-weight:800;letter-spacing:0.04em;${statusStyle}">${statusLabel}</span>
                  <span style="font-size:11px;color:#8e8e93;">${formatShortFrenchDate(log.date)}</span>
                </div>
                <div class="flex items-end justify-between">
                  <div>
                    <h2 style="font-size:19px;font-weight:800;color:#fff;margin:2px 0 0 0;">Bilan : ${log.sessionName}</h2>
                    <p style="font-size:11px;color:#8e8e93;margin:2px 0 0 0;">Analyse biomécanique & adaptation Markov</p>
                  </div>
                  <div class="text-right">
                    <div style="font-size:10px;color:#8e8e93;text-transform:uppercase;">Densité</div>
                    <div class="tabular-nums" style="font-size:18px;font-weight:800;color:#0a84ff;">${densityScore}<span style="font-size:11px;font-weight:500;color:#8e8e93;">/100</span></div>
                  </div>
                </div>
              </div>

              ${endProposal ? `

    async function saveBiometricsEntry() {
      const w = parseFloat(document.getElementById('input-bio-weight')?.value);
      const bf = parseFloat(document.getElementById('input-bio-bf')?.value);
      if (isNaN(w) || w < 40 || w > 250 || isNaN(bf) || bf < 4 || bf > 60) {
        return showToast('Valeurs biométriques invalides.', 'warning');
      }
      const st = UIState.state;
      const todayStr = formatDateISO(new Date());
      st.profile.weight = w;
      st.profile.bodyFat = bf;
      const leanMass = w * (1 - bf / 100);
      st.profile.targetProteinG = Math.round(leanMass * 1.8);
      st.profile.biometricsHistory.push({ date: todayStr, weight: w, bodyFat: bf });

      await DB.saveState(st);
      closeModal();
      renderApp();
      showToast('Biométrie et cible protéique mises à jour.', 'success');
    }

                <div onclick="closeModal(); navigateTo('workout', '${s.code}')" class="ios-card-interactive flex items-center justify-between cursor-pointer" style="padding:12px 14px;border-color:rgba(191,90,242,0.35);">
                  <div>
                    <div class="flex items-center gap-2">
                      <span style="padding:2px 7px;border-radius:6px;background:rgba(191,90,242,0.2);color:#bf5af2;font-size:10px;font-weight:700;">TEST</span>
                      <span style="font-size:13px;font-weight:700;color:#fff;">${s.name}</span>
                    </div>
                    <p style="font-size:10px;color:#8e8e93;margin:2px 0 0 0;">${s.subtitle}</p>
                  </div>
                  <span style="font-size:12px;color:#bf5af2;font-weight:700;">Tester ›</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Bottom Sheet : Détail d'une date du Calendrier
    function openCalendarDateSheet(dateStr) {
      const st = UIState.state;
      const rolling = computeWeeklyRollingSchedule(st);
      const log = st.sessionLogs.find(l => l.date === dateStr);
      const sched = rolling.scheduleMap[dateStr];

      const root = document.getElementById('modal-root');
      root.style.pointerEvents = 'auto';

      let contentHTML = '';
      if (log) {
        const logIndex = st.sessionLogs.findIndex(l => l.id === log.id);
        contentHTML = `
          <div class="flex items-center justify-between">
            <span style="padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:${log.optimal ? 'rgba(48,209,88,0.18)' : 'rgba(255,159,10,0.18)'};color:${log.optimal ? '#30d158' : '#ff9f0a'};">
              ${log.optimal ? 'Séance Optimale' : 'Alerte / Adaptation'}
            </span>
            <span style="font-size:12px;color:#8e8e93;">RPE ${log.rpe}/10 • Douleur SI ${log.painIndex}/10</span>
          </div>
          <h4 style="font-size:16px;font-weight:700;color:#fff;margin:0;">${log.sessionName}</h4>
          <div style="padding:12px;border-radius:12px;background:#1c1c1e;border:1px solid rgba(255,255,255,0.06);font-size:12px;color:#8e8e93;">
            <strong style="color:#fff;display:block;margin-bottom:2px;">Diagnostic Markov :</strong>
            ${log.diagnostic}
          </div>
          <div class="space-y-1-5 overflow-y-auto no-scrollbar" style="max-height:200px;">
            ${(log.exercisesLogged || []).map(ex => `
              <div class="flex items-center justify-between" style="background:#1c1c1e;padding:8px 12px;border-radius:12px;font-size:12px;">
                <span class="truncate" style="font-weight:500;color:#fff;max-width:185px;">${ex.name}</span>
                <span class="tabular-nums" style="color:#8e8e93;">${ex.abandoned ? '<strong style="color:#ff453a;">ABANDON</strong>' : `${ex.sets}×${ex.reps} @ ${ex.weight > 0 ? ex.weight + 'kg' : 'PDC'} • <strong style="color:#0a84ff;">${ex.e1rm}kg</strong>`}</span>
              </div>
            `).join('')}
          </div>
          <button onclick="openPostWorkoutSummaryModal(UIState.state.sessionLogs[${logIndex}])" class="btn-active w-full" style="padding:13px;border-radius:16px;background:#0a84ff;color:#fff;font-weight:700;font-size:13px;border:none;margin-top:6px;">
            Ouvrir le Bilan Visuel Complet & Implications N+1 ›
          </button>
        `;
      } else if (sched && sched.type === 'scheduled') {
        const sess = SESSION_TEMPLATES[sched.sessionCode];
        contentHTML = `
          <div class="flex items-center justify-between">
            <span style="padding:2px 8px;border-radius:6px;background:rgba(10,132,255,0.18);color:#0a84ff;font-size:11px;font-weight:700;">
              ${sched.shifted ? 'Séance Décalée (Calendrier Glissant)' : 'Séance Planifiée'}
            </span>
            <span style="font-size:12px;color:#8e8e93;">${sess.durationTarget}</span>
          </div>
          <h4 style="font-size:16px;font-weight:700;color:#fff;margin:0;">${sess.name}</h4>
          <p style="font-size:12px;color:#8e8e93;margin:0;">${sess.subtitle}</p>
          <div class="space-y-1-5 overflow-y-auto no-scrollbar" style="max-height:220px;">
            ${sess.exercises.map(exId => {
              const ex = st.catalog[exId];
              return `
                <div class="flex items-center justify-between" style="background:#1c1c1e;padding:8px 12px;border-radius:12px;font-size:12px;">
                  <span class="truncate" style="font-weight:500;color:#fff;max-width:185px;"><strong style="color:#0a84ff;">${ex.order}</strong> ${ex.name}</span>
                  <span class="tabular-nums" style="color:#ff9f0a;font-weight:600;">${ex.targetSets}×${ex.minReps}-${ex.maxReps} @ ${ex.targetWeight > 0 ? ex.targetWeight + 'kg' : 'PDC'}</span>
                </div>
              `;
            }).join('')}
          </div>
          <button onclick="closeModal(); navigateTo('workout', '${sess.code}')" class="btn-active w-full" style="padding:13px;border-radius:16px;background:#0a84ff;color:#fff;font-weight:600;font-size:14px;border:none;margin-top:6px;">
            Démarrer cette séance maintenant
          </button>
        `;
      } else {
        contentHTML = `
          <div class="text-center space-y-2" style="padding:24px 0;">
            <div style="font-size:14px;font-weight:600;color:#fff;">Jour de Repos / Récupération</div>
            <p style="font-size:12px;color:#8e8e93;margin:0;">Protocole quotidien recommandé : Big 3 de McGill (10-15 min), mobilité hanches 90/90 et suspension passive.</p>
          </div>
        `;
      }

      root.innerHTML = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:flex-end;justify-content:center;" class="backdrop-animate">
          <div style="width:100%;max-width:430px;background:#161618;border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid rgba(255,255,255,0.14);padding:20px 20px max(28px,var(--safe-bottom)) 20px;" class="space-y-3 sheet-animate">
            <div style="width:40px;height:4px;background:#3a3a3c;border-radius:999px;margin:0 auto;"></div>
            <div class="flex items-center justify-between">
              <span class="capitalize" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#8e8e93;">${formatFrenchDate(dateStr)}</span>
              <button onclick="closeModal()" style="font-size:12px;font-weight:600;color:#0a84ff;background:none;border:none;">Fermer</button>
            </div>
            ${contentHTML}
          </div>
        </div>
      `;
    }

    // Modal : Gestion des Données (Export JSON, Import JSON, Protocole de Calibration & Démo)
    function openDataModal() {
      const root = document.getElementById('modal-root');
      root.style.pointerEvents = 'auto';

      root.innerHTML = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:flex-end;justify-content:center;" class="backdrop-animate">
          <div style="width:100%;max-width:430px;background:#161618;border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid rgba(255,255,255,0.14);padding:20px 20px max(28px,var(--safe-bottom)) 20px;" class="space-y-4 sheet-animate">
            <div style="width:40px;height:4px;background:#3a3a3c;border-radius:999px;margin:0 auto;"></div>
            <div class="flex items-center justify-between">
              <div>
                <h3 style="font-size:16px;font-weight:700;color:#fff;margin:0;">Persistance & Sauvegardes</h3>
                <p style="font-size:11px;color:#8e8e93;margin:2px 0 0 0;">Base locale 100% IndexedDB (${DB_NAME} / ${STORE_NAME})</p>
              </div>
              <button onclick="closeModal()" style="font-size:12px;font-weight:600;color:#0a84ff;background:none;border:none;">Fermer</button>
            </div>

            <div class="space-y-2-5">
              <button onclick="exportBackupJSON()" class="btn-active w-full flex items-center justify-between text-left" style="padding:14px;border-radius:16px;background:#1c1c1e;border:1px solid var(--border-subtle);">
                <div>
                  <div style="font-size:14px;font-weight:600;color:#0a84ff;">Exporter une sauvegarde JSON</div>
                  <div style="font-size:11px;color:#8e8e93;">Télécharge hypertrophy_os_backup_${formatDateISO(new Date())}.json</div>
                </div>
                <span style="font-size:15px;color:#0a84ff;">↓</span>
              </button>

              <label class="btn-active w-full flex items-center justify-between text-left cursor-pointer" style="padding:14px;border-radius:16px;background:#1c1c1e;border:1px solid var(--border-subtle);">
                <div>
                  <div style="font-size:14px;font-weight:600;color:#30d158;">Importer & Restaurer un fichier JSON</div>
                  <div style="font-size:11px;color:#8e8e93;">Écrase intégralement l'état actif dans IndexedDB</div>
                </div>
                <span style="font-size:15px;color:#30d158;">↑</span>
                <input type="file" accept=".json,application/json" class="hidden" onchange="importBackupJSON(event)"/>
              </label>

              <div style="padding:14px;border-radius:16px;background:rgba(191,90,242,0.1);border:1px solid rgba(191,90,242,0.35);" class="space-y-2">
                <div style="font-size:12px;font-weight:700;color:#bf5af2;">Protocole de Calibration & Réinitialisation</div>
                <p style="font-size:11px;color:#8e8e93;margin:0;">Lancez les <strong>2 micro-séances de calibration (Upper & Lower, ~20 min)</strong> pour tester vos charges en RIR 0 technique et calculer automatiquement vos poids Semaine 1.</p>
                <div class="flex gap-2" style="padding-top:4px;">
                  <button onclick="startCalibrationProtocol()" class="btn-active flex-1" style="padding:10px 8px;border-radius:12px;background:#bf5af2;color:#fff;font-size:12px;font-weight:700;border:none;">
                    Lancer la Calibration
                  </button>
                  <button onclick="factoryResetDB(true)" class="btn-active flex-1" style="padding:10px 8px;border-radius:12px;background:#1c1c1e;border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:12px;font-weight:600;">
                    Restaurer Démo S2
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function startCalibrationProtocol() {
      if (UIState.workoutTimerInterval) clearInterval(UIState.workoutTimerInterval);
      if (UIState.restTimerInterval) clearInterval(UIState.restTimerInterval);
      const freshState = createSeedState(false);
      await DB.saveState(freshState);
      UIState.state = freshState;
      updateFloatingRestOverlay(0, 0, '');
      closeModal();
      navigateTo('workout', 'CAL_U');
      showToast('Calibration 1/2 (Test Upper) lancée : 2 séries légères + 1 Top Set.', 'info');
    }

    function exportBackupJSON() {
      const st = UIState.state;
      const dateStr = formatDateISO(new Date());
      const filename = `hypertrophy_os_backup_${dateStr}.json`;
      const blob = new Blob([JSON.stringify(st, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Sauvegarde ${filename} exportée.`, 'success');
    }

    function importBackupJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !parsed.catalog || !parsed.profile) {
            throw new Error('Structure JSON HYPERTROPHY.OS invalide.');
          }
          openImportConfirmationModal(parsed, file.name);
        } catch (err) {
          showToast('Erreur d’import : ' + err.message, 'warning');
        }
      };
      reader.readAsText(file);
    }

    function openImportConfirmationModal(parsedData, fileName) {
      UIState._pendingImportData = parsedData;
      const logsCount = Array.isArray(parsedData.sessionLogs) ? parsedData.sessionLogs.length : 0;
      const lastLogDate = logsCount > 0
        ? formatShortFrenchDate(parsedData.sessionLogs[logsCount - 1].date)
        : 'Aucune séance';
      const weightVal = parsedData.profile?.weight ? `${Number(parsedData.profile.weight).toFixed(1)} kg` : 'N/A';
      const fileVersion = parsedData.version || 'Antérieure';
      const needsMigration = fileVersion !== APP_VERSION;

      const root = document.getElementById('modal-root');
      root.style.pointerEvents = 'auto';
      root.innerHTML = `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.84);display:flex;align-items:flex-end;justify-content:center;" class="backdrop-animate">
          <div style="width:100%;max-width:430px;background:#161618;border-top-left-radius:24px;border-top-right-radius:24px;border-top:1px solid rgba(255,159,10,0.5);padding:20px 20px max(28px,var(--safe-bottom)) 20px;" class="space-y-4 sheet-animate">
            <div style="width:40px;height:4px;background:#3a3a3c;border-radius:999px;margin:0 auto;"></div>
            <div class="flex items-center justify-between">
              <h3 style="font-size:16px;font-weight:700;color:#ff9f0a;margin:0;">Confirmer la restauration JSON</h3>
              <button onclick="UIState._pendingImportData = null; openDataModal();" style="font-size:12px;font-weight:600;color:#8e8e93;background:none;border:none;">Annuler</button>
            </div>

            <div style="background:#1c1c1e;padding:12px;border-radius:14px;border:1px solid var(--border-subtle);" class="space-y-1-5">
              <div style="font-size:11px;color:#8e8e93;">Fichier : <strong style="color:#fff;">${fileName}</strong></div>
              <div class="grid grid-cols-2 gap-2" style="padding-top:4px;font-size:11px;">
                <div style="background:#121212;padding:8px;border-radius:10px;">
                  <div style="color:#8e8e93;font-size:10px;">Version</div>
                  <div style="color:#0a84ff;font-weight:700;">${fileVersion}</div>
                </div>
                <div style="background:#121212;padding:8px;border-radius:10px;">
                  <div style="color:#8e8e93;font-size:10px;">Séances en archive</div>
                  <div style="color:#30d158;font-weight:700;">${logsCount} (${lastLogDate})</div>
                </div>
                <div style="background:#121212;padding:8px;border-radius:10px;">
                  <div style="color:#8e8e93;font-size:10px;">Biométrie</div>
                  <div style="color:#fff;font-weight:700;">${weightVal}</div>
                </div>
                <div style="background:#121212;padding:8px;border-radius:10px;">
                  <div style="color:#8e8e93;font-size:10px;">Compatibilité</div>
                  <div style="color:${needsMigration ? '#ff9f0a' : '#30d158'};font-weight:700;">${needsMigration ? 'Migration auto' : 'Exacte'}</div>
                </div>
              </div>
            </div>

            <p style="font-size:11px;color:#e5e5ea;margin:0;">
              Cette opération va <strong>écraser intégralement</strong> votre base IndexedDB active. Souhaitez-vous continuer ?
            </p>

            <div class="flex gap-2">
              <button onclick="UIState._pendingImportData = null; openDataModal();" class="btn-active flex-1" style="padding:13px;border-radius:14px;background:#1c1c1e;border:1px solid var(--border-subtle);color:#fff;font-weight:600;font-size:13px;">
                Annuler
              </button>
              <button onclick="executeConfirmedImportJSON()" class="btn-active flex-1" style="padding:13px;border-radius:14px;background:#30d158;color:#000;font-weight:700;font-size:13px;border:none;">
                Confirmer & Restaurer
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function executeConfirmedImportJSON() {
      const parsed = UIState._pendingImportData;
      UIState._pendingImportData = null;
      if (!parsed) return;
      try {
        parsed.id = STATE_KEY;
        parsed.version = APP_VERSION;
        if (!parsed.mesocycleState) {
          parsed.mesocycleState = createSeedState(false).mesocycleState;
        }
        if (!Array.isArray(parsed.mesocycleState.calibratedSessions)) {
          parsed.mesocycleState.calibratedSessions = [];
        }
        await DB.saveState(parsed);
        UIState.state = parsed;
        closeModal();
        renderApp();
        showToast('Base IndexedDB restaurée et migrée avec succès.', 'success');
      } catch (err) {
        showToast('Échec de la restauration : ' + err.message, 'warning');
      }
    }

    async function factoryResetDB(withDemo) {
      if (UIState.workoutTimerInterval) clearInterval(UIState.workoutTimerInterval);
      if (UIState.restTimerInterval) clearInterval(UIState.restTimerInterval);
      const freshState = createSeedState(withDemo);
      await DB.saveState(freshState);
      UIState.state = freshState;
      updateFloatingRestOverlay(0, 0, '');
      closeModal();
      navigateTo('dashboard');
      showToast(
        withDemo
          ? 'Base réinitialisée avec l’historique de démonstration.'
          : 'Calibration activée : démarrez le Test Upper.',
        'info'
      );
    }

    /********************************************************************
     * PWA MANIFEST DYNAMIQUE & INITIALISATION AU DÉMARRAGE
     ********************************************************************/
    function initInlinePWAManifest() {
      try {
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#000000"/><circle cx="256" cy="256" r="168" fill="none" stroke="#0a84ff" stroke-width="28"/><text x="256" y="292" text-anchor="middle" fill="#ffffff" font-family="-apple-system,sans-serif" font-size="144" font-weight="800">H</text></svg>`;
        const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);

        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);

        const manifestObj = {
          name: 'HYPERTROPHY.OS',
          short_name: 'HYPERTROPHY',
          start_url: '.',
          display: 'standalone',
          background_color: '#000000',
          theme_color: '#000000',
          icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
        };
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(blob);
        document.head.appendChild(manifestLink);
      } catch (_) {}
    }

    function renderApp() {
      renderHeader();
      if (UIState.currentScreen === 'dashboard') {
        renderDashboard();
      } else if (UIState.currentScreen === 'muscle_detail') {
        renderMuscleDetail();
      } else if (UIState.currentScreen === 'calendar') {
        renderCalendarScreen();
      } else if (UIState.currentScreen === 'workout') {
        renderWorkoutScreen();
      }
      const rem = getRestRemainingSec();
      const act = UIState.state?.activeSession;
      updateFloatingRestOverlay(rem, act?.restTotalSec || 120, act?.restContextLabel || '');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      initInlinePWAManifest();
      try {
        const loaded = await DB.loadState();
        UIState.state = loaded;
        if (loaded.activeSession) {
          ensureWorkoutLoopsRunning();
        }
        renderApp();
      } catch (err) {
        console.error('Erreur critique IndexedDB:', err);
        UIState.state = createSeedState(true);
        renderApp();
      }
    });
  </script>
</body>
</html>
