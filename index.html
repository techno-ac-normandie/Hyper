<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HYPERTROPHY.OS" />
  <meta name="theme-color" content="#000000" />
  <title>HYPERTROPHY.OS v0.5.0</title>
  <!-- Inline SVG Apple Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23000000'/%3E%3Crect x='14' y='14' width='152' height='152' rx='30' fill='%23121212' stroke='%230A84FF' stroke-width='4'/%3E%3Ctext x='90' y='108' font-family='-apple-system,sans-serif' font-size='64' font-weight='800' fill='%23FFFFFF' text-anchor='middle'%3EH%3C/text%3E%3Ccircle cx='138' cy='44' r='10' fill='%2330D158'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #000000;
      --card: #121212;
      --elevated: #1C1C1E;
      --elevated-2: #2C2C2E;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.22);
      --text: #FFFFFF;
      --text-sec: #A1A1A6;
      --text-muted: #6E6E73;
      --blue: #0A84FF;
      --green: #30D158;
      --orange: #FF9F0A;
      --red: #FF453A;
      --purple: #BF5AF2;
      --radius: 16px;
      --radius-sm: 12px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, select {
      font-family: inherit;
      touch-action: manipulation;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* App shell centered for iPhone Pro Max (430px) */
    #app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      padding-bottom: calc(132px + var(--safe-bottom));
    }

    /* Glass Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + var(--safe-top)) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill-btn {
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-btn:active { opacity: 0.75; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .badge-gray { background: rgba(161, 161, 166, 0.18); color: var(--text-sec); }
    .badge-blue { background: rgba(10, 132, 255, 0.2); color: #5AC8FA; }
    .badge-green { background: rgba(48, 209, 88, 0.18); color: var(--green); }
    .badge-orange { background: rgba(255, 159, 10, 0.2); color: var(--orange); }
    .badge-red { background: rgba(255, 69, 58, 0.2); color: var(--red); }
    .badge-purple { background: rgba(191, 90, 242, 0.2); color: var(--purple); }

    /* Main Content */
    .content {
      padding: 14px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .card-elevated {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
    }

    .card-clickable {
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .card-clickable:active {
      transform: scale(0.985);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-sec);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .text-xs { font-size: 11px; }
    .text-sm { font-size: 13px; }
    .text-muted { color: var(--text-sec); }
    .fw-700 { font-weight: 700; }

    /* Biometry 4-col grid */
    .bio-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .bio-cell {
      background: var(--elevated);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .bio-val {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }

    .bio-lbl {
      font-size: 10px;
      color: var(--text-sec);
      margin-top: 2px;
    }

    /* 2 Equal Columns Muscle Grid */
    .muscle-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }

    .muscle-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .muscle-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
    }
    .muscle-card:active { transform: scale(0.98); border-color: rgba(255,255,255,0.2); }

    .mc-line1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .mc-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mc-line2 {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .prog-track {
      flex: 1;
      height: 6px;
      background: var(--elevated-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
      transition: width 0.25s ease;
    }
    .prog-fill.complete { background: var(--green); }

    .mc-ratio {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sec);
      min-width: 30px;
      text-align: right;
    }

    .mc-line3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sec);
    }

    .mc-ref {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .btn:active { opacity: 0.8; transform: scale(0.99); }
    .btn-primary { background: var(--blue); color: #FFFFFF; }
    .btn-green { background: var(--green); color: #000000; }
    .btn-orange { background: var(--orange); color: #000000; }
    .btn-red { background: var(--red); color: #FFFFFF; }
    .btn-secondary {
      background: var(--elevated-2);
      color: #FFFFFF;
      border: 1px solid var(--border-strong);
    }
    .btn-sm { padding: 9px 12px; font-size: 12px; border-radius: 10px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-flex { flex: 1; width: auto; }

    /* Sticky Bottom CTA */
    .sticky-bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      z-index: 35;
      background: rgba(12, 12, 14, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      padding: 10px 14px calc(12px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-btn {
      background: transparent;
      border: none;
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      padding: 4px;
      cursor: pointer;
      text-align: center;
    }

    /* Floating Rest Timer Pill */
    .floating-timer {
      position: fixed;
      bottom: calc(108px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 406px;
      z-index: 50;
      background: rgba(24, 24, 28, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid var(--blue);
      border-radius: 20px;
      padding: 12px 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.72);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .floating-timer.urgent {
      border-color: var(--orange);
    }

    .ft-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ft-digits {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }

    .ft-meta {
      flex: 1;
      min-width: 0;
    }

    .ft-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .ft-btn {
      background: var(--elevated-2);
      color: #FFFFFF;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .ft-btn:active { background: #3A3A3C; }
    .ft-btn.accent { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }

    /* Banner */
    .banner {
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .banner-blue { background: rgba(10, 132, 255, 0.14); border-color: rgba(10, 132, 255, 0.45); }
    .banner-orange { background: rgba(255, 159, 10, 0.14); border-color: rgba(255, 159, 10, 0.45); }
    .banner-purple { background: rgba(191, 90, 242, 0.14); border-color: rgba(191, 90, 242, 0.45); }

    /* Active Workout & Steppers */
    .ex-header-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: var(--elevated);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .bio-svg-box {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      background: #0A0A0C;
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .bio-svg-box svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .svg-frame-a { animation: frameA 2.2s infinite; }
    .svg-frame-b { animation: frameB 2.2s infinite; }

    @keyframes frameA {
      0%, 48% { opacity: 1; }
      52%, 100% { opacity: 0; }
    }
    @keyframes frameB {
      0%, 48% { opacity: 0; }
      52%, 100% { opacity: 1; }
    }

    .round-card {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .round-card.round-done {
      border-color: rgba(48, 209, 88, 0.45);
      background: rgba(48, 209, 88, 0.05);
    }

    .round-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--blue);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .set-card-row {
      background: #141416;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px;
      margin-bottom: 8px;
    }
    .set-card-row:last-child { margin-bottom: 0; }

    .set-top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .set-ex-label {
      font-size: 13px;
      font-weight: 700;
      min-width: 0;
    }

    .set-ex-sub {
      font-size: 11px;
      color: var(--text-sec);
      font-weight: 500;
    }

    .check-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1.5px solid var(--border-strong);
      background: var(--elevated-2);
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .check-btn.checked {
      background: var(--green);
      border-color: var(--green);
      color: #000000;
    }

    .set-controls-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr 0.9fr;
      gap: 6px;
    }

    .stepper-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .input-mini-lbl {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sec);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stepper-group {
      display: flex;
      align-items: center;
      background: #0D0D0F;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      overflow: hidden;
      height: 34px;
    }

    .stepper-btn {
      width: 28px;
      min-width: 28px;
      height: 100%;
      background: var(--elevated-2);
      color: #FFFFFF;
      border: none;
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .stepper-btn:first-child { border-right: 1px solid var(--border-strong); }
    .stepper-btn:last-child { border-left: 1px solid var(--border-strong); }
    .stepper-btn:active { background: #3F3F44; }

    .stepper-val {
      width: 100%;
      min-width: 0;
      height: 100%;
      background: transparent;
      border: none;
      color: #FFFFFF;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      padding: 0 2px;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }
    .stepper-val::-webkit-outer-spin-button,
    .stepper-val::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .set-manage-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    /* Calendar */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .cal-wd {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sec);
      padding-bottom: 4px;
    }

    .cal-cell {
      aspect-ratio: 1 / 1.08;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 2px;
      font-size: 12px;
      font-weight: 700;
      position: relative;
    }

    .cal-cell.empty {
      background: transparent;
      border-color: transparent;
    }

    .cal-cell.today {
      border: 1.5px solid #FFFFFF;
    }

    .cal-cell.clickable {
      cursor: pointer;
    }
    .cal-cell.clickable:active { transform: scale(0.95); }

    .cal-code {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .cal-bar {
      width: 70%;
      height: 4px;
      border-radius: 999px;
    }
    .cal-bar.optimal { background: var(--green); }
    .cal-bar.suboptimal { background: var(--orange); }
    .cal-bar.scheduled { background: var(--blue); }

    /* Free launch 2x2 grid */
    .free-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .free-btn {
      background: var(--elevated);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 11px 10px;
      color: #FFFFFF;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .free-btn:active { background: var(--elevated-2); }

    /* Segmented Time Split Bar */
    .seg-bar {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      background: var(--elevated-2);
      margin: 8px 0;
    }
    .seg-active { background: var(--green); height: 100%; }
    .seg-rest { background: var(--blue); height: 100%; }
    .seg-trans { background: var(--orange); height: 100%; }

    /* Modals & Bottom Sheets */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.centered {
      align-items: center;
      padding: 16px;
    }

    .sheet-box {
      width: 100%;
      max-width: 430px;
      max-height: 88vh;
      overflow-y: auto;
      background: #141416;
      border-top: 1px solid var(--border-strong);
      border-radius: 22px 22px 0 0;
      padding: 16px 16px calc(22px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-box {
      width: 100%;
      max-width: 398px;
      max-height: 86vh;
      overflow-y: auto;
      background: #161618;
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 800;
    }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: var(--elevated-2);
      border: 1px solid var(--border-strong);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sec);
      margin-bottom: 4px;
      display: block;
    }

    .text-input {
      width: 100%;
      background: var(--elevated);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 10px 12px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: calc(64px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(28, 28, 30, 0.96);
      border: 1px solid var(--blue);
      color: #FFFFFF;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      max-width: 390px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      pointer-events: none;
    }

    .adj-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .adj-row:first-child { border-top: none; padding-top: 2px; }
  </style>
</head>

      const technogym_5 = [];
      for (let w = 5; w <= 150; w += 5) technogym_5.push(w);

          const val = Math.round((4.5 + 7 * n + 2.3 * m) * 10) / 10;
          if (val <= 145) matrix_chest.push(val);
        }
      }

      // Shoulderpress Matrix: 4.5*n (n>=1) + 0/1 * 2.3 kg up to ~120 kg

      for (let n = 1; n <= 26; n++) {
        for (let m = 0; m <= 1; m++) {
          const val = Math.round((4.5 * n + 2.3 * m) * 10) / 10;
          if (val <= 122) matrix_shoulder.push(val);
        }
      }

      // Matrix Aura G3-MSFT400 single pulley: 1.13 + 2.27*n (n=0..45)
      const matrix_cable_1 = [];
      for (let n = 0; n <= 45; n++) {
        matrix_cable_1.push(Math.round((1.13 + 2.27 * n) * 100) / 100);
      }

      const landmine_5 = [];
      for (let w = 5; w <= 150; w += 5) landmine_5.push(w);

      return {
        technogym_5:     uniqSort(technogym_5),
        matrix_chest:    uniqSort(matrix_chest),
        matrix_shoulder: uniqSort(matrix_shoulder),
        matrix_cable_1:  uniqSort(matrix_cable_1),
        landmine_5:      uniqSort(landmine_5),
        pdc_kb10:        [0, 10, 20],
        iso_kb10:        [10, 20]
      };
    })();

    function snapToEquipment(equipKey, targetKg, mode) {
      const m = mode || "nearest";
      const grid = EQUIPMENT_GRIDS[equipKey];
      if (!grid || !grid.length) return Math.max(0, Math.round((Number(targetKg) || 0) * 10) / 10);
      const val = Number(targetKg) || 0;
      if (m === "up") {
        const found = grid.find(g => g > val + 0.001);
        return found !== undefined ? found : grid[grid.length - 1];
      }
      if (m === "down") {
        let res = grid[0];
        for (let i = 0; i < grid.length; i++) {
          if (grid[i] < val - 0.001) res = grid[i];
        }
        return res;
      }
      let best = grid[0];
      let bestDiff = Math.abs(grid[0] - val);
      for (let i = 1; i < grid.length; i++) {
        const diff = Math.abs(grid[i] - val);
        if (diff < bestDiff) {
          bestDiff = diff;
          best = grid[i];
        }
      }
      return best;
    }

    function stepEquipment(equipKey, currentKg, dir) {
      const grid = EQUIPMENT_GRIDS[equipKey];
      if (!grid || !grid.length) return Math.max(0, (Number(currentKg) || 0) + (dir >= 0 ? 2.5 : -2.5));
      const snapped = snapToEquipment(equipKey, currentKg, "nearest");
      const idx = grid.indexOf(snapped);
      const nextIdx = Math.max(0, Math.min(grid.length - 1, idx + (dir >= 0 ? 1 : -1)));
      return grid[nextIdx];
    }

      const s = n.toFixed(2);

    /* ========================================================================
       4. INDEXEDDB PERSISTENCE (100% IndexedDB, ZERO localStorage)
       ======================================================================== */
    const DB = {
      conn: null,
      memoryFallback: null,
      saveTimer: null,

      open() {
        return new Promise((resolve) => {
          if (this.conn) return resolve(this.conn);
          if (!("indexedDB" in window)) return resolve(null);
          try {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
              }
            };
            req.onsuccess = (e) => {
              const db = e.target.result;
              db.onclose = () => { this.conn = null; };
              db.onversionchange = () => {
                try { db.close(); } catch (_) {}
                this.conn = null;
              };
              this.conn = db;
              resolve(db);
            };
            req.onerror = () => resolve(null);
          } catch (_) {
            resolve(null);
          }
        });
      },

      async load() {
        const db = await this.open();
        if (!db) return this.memoryFallback;
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(STORE_NAME, "readonly");
            const req = tx.objectStore(STORE_NAME).get(ROOT_KEY);
            req.onsuccess = () => resolve(req.result || this.memoryFallback);
            req.onerror = () => resolve(this.memoryFallback);
          } catch (err) {
            if (err && err.name === "InvalidStateError") {
              this.conn = null;
              this.open().then(reDb => {
                if (!reDb) return resolve(this.memoryFallback);
                try {
                  const tx2 = reDb.transaction(STORE_NAME, "readonly");
                  const r2 = tx2.objectStore(STORE_NAME).get(ROOT_KEY);
                  r2.onsuccess = () => resolve(r2.result || this.memoryFallback);
                  r2.onerror = () => resolve(this.memoryFallback);
                } catch (_) { resolve(this.memoryFallback); }
              });
            } else {
              resolve(this.memoryFallback);
            }
          }
        });
      },

      async writeNow(data) {
        this.memoryFallback = JSON.parse(JSON.stringify(data));
        const db = await this.open();
        if (!db) return;
        return new Promise((resolve) => {
          const attempt = (targetDb, retry) => {
            try {
              const tx = targetDb.transaction(STORE_NAME, "readwrite");
              tx.objectStore(STORE_NAME).put(this.memoryFallback, ROOT_KEY);
              tx.oncomplete = () => resolve();
              tx.onerror = () => resolve();
            } catch (err) {
              if (retry && err && err.name === "InvalidStateError") {
                this.conn = null;
                this.open().then(newDb => newDb ? attempt(newDb, false) : resolve());
              } else {
                resolve();
              }
            }
          };
          attempt(db, true);
        });
      },

      scheduleSave(data) {
        this.memoryFallback = JSON.parse(JSON.stringify(data));
        clearTimeout(this.saveTimer);
        this.saveTimer = setTimeout(() => {
          this.writeNow(this.memoryFallback);
        }, 180);
      }
    };

    /* ========================================================================
       5. WEB AUDIO ENGINE (5,4,3,2,1s short beep + 0s double long beep)
       ======================================================================== */
    const Sound = {
      ctx: null,
      ensure() {
        try {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
        } catch (_) {}
      },
      beep(freq, dur, delay) {
        try {
          this.ensure();
          if (!this.ctx) return;
          const t0 = this.ctx.currentTime + (delay || 0);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, t0);
          gain.gain.setValueAtTime(0.001, t0);
          gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t0);
          osc.stop(t0 + dur + 0.02);
        } catch (_) {}
      },
      tick() { this.beep(880, 0.09, 0); },
      done() {
        this.beep(1046, 0.28, 0);
        this.beep(1318, 0.36, 0.34);
      }
    };

    /* ========================================================================
       6. DATE, BIOMETRY & ROLLING CALENDAR HELPERS
       ======================================================================== */
    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function parseISODate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d, 12, 0, 0);
    }

    function addDays(isoStr, days) {
      const d = parseISODate(isoStr);
      d.setDate(d.getDate() + days);
      return toISODate(d);
    }

    function getMondayOfWeek(isoStr) {
      const d = parseISODate(isoStr);
      const wd = d.getDay(); // 0=Sun, 1=Mon
      const diff = wd === 0 ? -6 : 1 - wd;
      d.setDate(d.getDate() + diff);
      return toISODate(d);
    }

    function getEffectiveToday(state) {
      const base = toISODate(new Date());
      return addDays(base, (state && state.simDayOffset) ? state.simDayOffset : 0);
    }

    function formatShortDate(iso) {
      if (!iso) return "—";
      const d = parseISODate(iso);
      return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short" });
    }

    function formatMMSS(sec) {
      const s = Math.max(0, Math.floor(sec));
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function calcProteinTarget(weightKg, bodyFatPct) {
      const lean = (Number(weightKg) || 110) * (1 - (Number(bodyFatPct) || 27.5) / 100);
      return Math.round(lean * 1.8);
    }

    function getEffectiveTargetSets(ex, state) {
      let n = ex.sets;
      if (state.cycle.phase === "deload") {
        n = Math.max(2, Math.round(n * 0.65));
      } else if (state.clinical.siAlertActive && ex.siSensitive) {
        n = Math.max(2, n - 1);
      }
      return n;
    }

    function getEffectiveTargetRir(ex, state) {
      if (state.cycle.phase === "deload") return 3;
      const p = state.prescriptions[ex.id];
      return p && typeof p.targetRir === "number" ? p.targetRir : ex.defaultRir;
    }

    // Rolling Calendar: shifts missed weekly sessions (Mon, Tue, Thu, Fri) to today and Sat/Sun buffers
    function computeWeekSchedule(weekMonday, state, todayStr) {
      const baseSlots = [
        { code: "UA", offset: 0 },
        { code: "LA", offset: 1 },
        { code: "UB", offset: 3 },
        { code: "LB", offset: 4 }
      ];
      const weekEnd = addDays(weekMonday, 6);
      const doneCodes = new Set();
      (state.history || []).forEach(h => {
        if (h.date >= weekMonday && h.date <= weekEnd) doneCodes.add(h.workoutCode);
      });

      const scheduledMap = {};
      let cursor = null;

      baseSlots.forEach(slot => {
        if (doneCodes.has(slot.code)) return;
        let targetDate = addDays(weekMonday, slot.offset);
        if (weekEnd >= todayStr && targetDate < todayStr) {
          targetDate = todayStr;
        }
        if (cursor && targetDate <= cursor) {
          targetDate = addDays(cursor, 1);
        }
        if (targetDate <= weekEnd) {
          scheduledMap[targetDate] = slot.code;
          cursor = targetDate;
        }
      });

      return scheduledMap;
    }

    function getScheduledMapForMonth(year, monthIdx, state, todayStr) {
      const map = {};
      const first = new Date(year, monthIdx, 1, 12, 0, 0);
      const last = new Date(year, monthIdx + 1, 0, 12, 0, 0);
      let mon = getMondayOfWeek(toISODate(first));
      while (mon <= toISODate(last)) {
        const wkMap = computeWeekSchedule(mon, state, todayStr);
        Object.keys(wkMap).forEach(d => {
          if (d >= todayStr) map[d] = wkMap[d];
        });
        mon = addDays(mon, 7);
      }
      return map;
    }

    /* ========================================================================
       7. MATH, MARKOV ENGINE & MESOCYCLE 4-SIGNAL DETECTOR
       ======================================================================== */
    function computeE1RM(weight, reps, rir, ex, profileWeightKg) {
      const w = Number(weight) || 0;
      const r = Number(reps) || 0;
      const rr = Math.max(0, Number(rir) || 0);
      if (r <= 0) return 0;

      if (ex.type === "isometric") {
        const effW = w > 0 ? w : 10;
        return Math.round((effW * (r / 15)) * 10) / 10;
      }

      let effW = w;
      if (w === 0 || ex.type === "bodyweight_kb") {
        effW = 0.65 * (Number(profileWeightKg) || 110) + (w > 0 ? w : 0);
      }

      const denom = Math.max(0.15, 1.0278 - 0.0278 * Math.min(30, r + rr));
      return Math.round((effW / denom) * 10) / 10;
    }

    function formatPerformedSetsSummary(exLog, ex) {
      const doneSets = (exLog.sets || []).filter(s => s.done);
      if (!doneSets.length) return "0 série (ABANDON)";

      const groups = [];
      doneSets.forEach(s => {
        const repsVal = Number(s.reps) || 0;
        const wVal = Number(s.weight) || 0;
        const repStr = ex && ex.type === "isometric" ? `${repsVal}s` : `${repsVal}`;
        const loadStr = (ex && ex.equip === "pdc_kb10" && wVal === 0) ? "PDC" : `${formatKg(wVal)} kg`;
        const key = `${repStr}|${loadStr}`;
        const last = groups.length ? groups[groups.length - 1] : null;
        if (last && last.key === key) last.count += 1;
        else groups.push({ key, count: 1, repStr, loadStr });
      });

      return groups.map(g => `${g.count} x ${g.repStr} @ ${g.loadStr}`).join(" + ");
    }

    function evaluateMesocycleSignals(state) {
      if (state.cycle.phase === "deload") {
        return { triggered: false, signals: [], signature: "" };
      }
      const signals = [];
      const hist = state.history || [];

      if (state.cycle.week >= 5 || (state.cycle.accumulationSessions || 0) >= 16) {
        signals.push({ code: "CAL", text: `Plafond calendaire atteint (Sem. ${state.cycle.week} / ${state.cycle.accumulationSessions} séances).` });
      }

      const last4 = hist.slice(-4);
      if (last4.length >= 4) {
        const avgRpe = last4.reduce((a, b) => a + (Number(b.rpe) || 0), 0) / last4.length;
        if (avgRpe > 8.5) {
          signals.push({ code: "SNC", text: `Fatigue SNC : RPE moyen ${avgRpe.toFixed(1)}/10 sur les 4 dernières séances.` });
        }
      }

      const last2 = hist.slice(-2);
      if (last2.length === 2 && last2.every(s => Number(s.siPain) >= 4)) {
        signals.push({ code: "SI", text: "Alerte clinique SI persistante (≥ 4/10 sur 2 séances consécutives)." });
      }

      const mainExs = Object.values(EXERCISES).filter(e => e.main && e.type !== "isometric");
      let evalCount = 0;
      let stalledCount = 0;
      mainExs.forEach(ex => {
        const arr = state.e1rmHistory[ex.id] || [];
        if (arr.length >= 3) {
          evalCount++;
          const last3 = arr.slice(-3).map(p => p.value);
          if (last3[2] <= last3[0] && last3[1] <= last3[0]) stalledCount++;
        }
      });
      if (evalCount >= 3 && (stalledCount / evalCount) >= 0.5) {
        signals.push({ code: "STAG", text: `Stagnation multi-exercices (${stalledCount}/${evalCount} mouvements principaux sur 3 séances).` });
      }

      const signature = signals.map(s => s.code).sort().join("+");
      return { triggered: signals.length > 0, signals, signature };
    }

    function finalizeWorkoutAndApplyMarkov(state, active, rpe, siPain, todayStr) {
      const workout = WORKOUTS[active.workoutCode];
      const totalSec = Math.max(60, Math.round((Date.now() - active.startedAt) / 1000));
      const restSec = Math.min(Math.round(totalSec * 0.72), Math.round(active.totalRestSec || 0));
      const doneTotal = active.setsFlat.filter(s => s.done).length;
      const activeSecRaw = Math.max(30, doneTotal * 38);

      let activePct = Math.round((activeSecRaw / totalSec) * 100);
      let restPct = Math.round((restSec / totalSec) * 100);
      if (activePct + restPct > 94) {
        const scale = 94 / (activePct + restPct);
        activePct = Math.max(5, Math.round(activePct * scale));
        restPct = Math.max(5, Math.round(restPct * scale));
      }
      const transPct = Math.max(0, 100 - activePct - restPct);
      const densityScore = Math.min(100, Math.round((doneTotal / Math.max(1, totalSec / 60)) * 180));

      const isDeload = state.cycle.phase === "deload";
      const exSummaries = [];
      const adjustments = [];
      const strengths = [];
      const suboptimals = [];

      // Rule 1: Clinical SI Circuit Breaker
      let siAction = null;
      if (siPain >= 4) {
        if (!state.clinical.siAlertActive) {
          state.clinical.siAlertActive = true;
          Object.values(EXERCISES).forEach(ex => {
            if (ex.siSensitive && state.prescriptions[ex.id] && state.prescriptions[ex.id].weight > 0) {
              state.prescriptions[ex.id].weight = snapToEquipment(ex.equip, state.prescriptions[ex.id].weight * 0.85, "nearest");
            }
          });
          siAction = "Coupe-circuit SI activé : -15% charge (snappé) & -1 série sur LA/LB.";
        } else {
          siAction = "Coupe-circuit SI maintenu (-15% charge & -1 série sur LA/LB).";
        }
        suboptimals.push(`Douleur lombaire / SI élevée (${siPain}/10) : protection clinique active.`);
      } else if (siPain <= 2 && state.clinical.siAlertActive) {
        state.clinical.siAlertActive = false;
        siAction = "Douleur SI ≤ 2/10 : restauration automatique du volume nominal LA/LB.";
        strengths.push("Tolérance sacro-iliaque excellente : volume nominal restauré.");
      }

      const exOrder = [];
      workout.blocks.forEach(b => b.exIds.forEach(id => exOrder.push(id)));
      let totalHardSets = 0;

      exOrder.forEach(exId => {
        const ex = EXERCISES[exId];
        const sets = active.setsFlat.filter(s => s.exId === exId);
        const doneSets = sets.filter(s => s.done);
        totalHardSets += doneSets.filter(s => Number(s.rir) <= 3).length;

        const presc = state.prescriptions[exId] || {
          weight: snapToEquipment(ex.equip, 20),
          targetRir: ex.defaultRir,
          targetReps: ex.minReps
        };
        const oldTargetReps = presc.targetReps || ex.minReps;
        const prevHist = state.e1rmHistory[exId] || [];
        const prevRecord = prevHist.length ? Math.max(...prevHist.map(h => h.value)) : 0;
        const prevLast = prevHist.length ? prevHist[prevHist.length - 1].value : 0;

        let status = "OK";
        let bestE1RM = 0;
        let topSet = null;
        let nextWeight = presc.weight;
        let nextRir = presc.targetRir;
        let nextTargetReps = oldTargetReps;
        let ruleReason = "Maintien";
        let pctChange = 0;
        let transitionText = "";

        const loadLabel = (w) => (ex.equip === "pdc_kb10" && w === 0) ? "PDC" : `${formatKg(w)} kg`;

        if (doneSets.length === 0) {
          status = "ABANDON";
          if (!isDeload && presc.weight > 0) {
            let downW = snapToEquipment(ex.equip, presc.weight * 0.95, "nearest");
            if (downW >= presc.weight) downW = snapToEquipment(ex.equip, presc.weight, "down");
            nextWeight = downW;
            pctChange = presc.weight > 0 ? Math.round(((nextWeight - presc.weight) / presc.weight) * 1000) / 10 : -5;
            ruleReason = "Abandon : cran de sécurité inférieur";
          } else {
            ruleReason = "Abandon (aucun e1RM ajouté)";
          }
          suboptimals.push(`${ex.shortName} : ABANDON (0 série validée).`);
        } else {
          doneSets.forEach(s => {
            const val = computeE1RM(s.weight, s.reps, s.rir, ex, state.profile.weightKg);
            if (val > bestE1RM) { bestE1RM = val; topSet = s; }
          });
          if (!state.e1rmHistory[exId]) state.e1rmHistory[exId] = [];
          state.e1rmHistory[exId].push({ date: todayStr, value: bestE1RM });

          const allHitMax = doneSets.every(s => Number(s.reps) >= ex.maxReps);
          const failedSet = doneSets.some(s => Number(s.reps) < ex.minReps && Number(s.rir) === 0);
          const baseW = topSet ? Number(topSet.weight) : presc.weight;

          if (doneSets.length < sets.length) {
            status = "Partiel";
            pctChange = 0;
            ruleReason = "Partiel : maintien strict de la charge";
            suboptimals.push(`${ex.shortName} : incomplet (${doneSets.length}/${sets.length} séries).`);
          } else if (isDeload) {
            status = "Décharge";
            pctChange = 0;
            ruleReason = "Phase Deload : récupération active (RIR 3)";
          } else if (siPain >= 4 && ex.siSensitive) {
            status = "SI -15%";
            nextWeight = presc.weight;
            pctChange = -15;
            ruleReason = "Coupe-circuit SI (-15% snappé & -1 série)";
          } else if (failedSet) {
            status = "Échec";
            if (ex.type === "isometric") {
              const step = ex.stepDur || 5;
              nextTargetReps = Math.max(ex.minReps, oldTargetReps - step);
              pctChange = oldTargetReps > 0 ? Math.round(((nextTargetReps - oldTargetReps) / oldTargetReps) * 1000) / 10 : -5;
              ruleReason = `Sanction d'échec RIR 0 : -${step}s`;
            } else if (presc.weight > 0) {
              let downW = snapToEquipment(ex.equip, presc.weight * 0.95, "nearest");
              if (downW >= presc.weight) downW = snapToEquipment(ex.equip, presc.weight, "down");
              nextWeight = downW;
              pctChange = Math.round(((nextWeight - presc.weight) / presc.weight) * 1000) / 10;
              ruleReason = "Sanction d'échec (reps < min à RIR 0) : cran inférieur";
            } else {
              nextTargetReps = ex.minReps;
              pctChange = -5;
              ruleReason = "Sanction d'échec PDC : retour bas de fourchette";
            }
            suboptimals.push(`${ex.shortName} : sous-fourchette à RIR 0 (ajustement négatif).`);
          } else if (ex.type === "isometric") {
            const step = ex.stepDur || 5;
            const curDur = topSet ? Number(topSet.reps) : oldTargetReps;
            if (allHitMax) {
              const upW = snapToEquipment(ex.equip, baseW, "up");
              if (upW > baseW) {
                nextWeight = upW;
                nextTargetReps = ex.minReps;
                nextRir = 2;
                pctChange = Math.round(((upW - baseW) / Math.max(1, baseW)) * 1000) / 10;
                ruleReason = `Plafond ${ex.maxReps}s validé → cran ${formatKg(upW)} kg & retour ${ex.minReps}s`;
                strengths.push(`${ex.shortName} : plafond ${ex.maxReps}s franchi → ${formatKg(upW)} kg.`);
              } else {
                nextTargetReps = ex.maxReps;
                nextRir = Math.max(0, presc.targetRir - 1);
                ruleReason = `Plafond ${ex.maxReps}s maintenu (charge max KB)`;
              }
            } else {
              nextTargetReps = Math.min(ex.maxReps, curDur + step);
              nextRir = Math.max(0, presc.targetRir - 1);
              pctChange = Math.round(((nextTargetReps - curDur) / Math.max(1, curDur)) * 1000) / 10;
              ruleReason = `Progression durée : +${step}s (${curDur}s → ${nextTargetReps}s)`;
              strengths.push(`${ex.shortName} : +${step}s validé pour la séance suivante.`);
            }
            transitionText = nextWeight !== presc.weight
              ? `${formatKg(presc.weight)} kg (${curDur}s) → ${formatKg(nextWeight)} kg (${nextTargetReps}s)`
              : `${curDur}s → ${nextTargetReps}s @ ${formatKg(nextWeight)} kg`;
          } else if (ex.equip === "pdc_kb10") {
            const minDone = Math.min(...doneSets.map(s => Number(s.reps) || 0));
            if (allHitMax) {
              const upW = snapToEquipment(ex.equip, baseW, "up");
              if (upW > baseW) {
                nextWeight = upW;
                nextTargetReps = ex.minReps;
                nextRir = 2;
                pctChange = 10;
                ruleReason = `15 reps validées → ajout KB (${loadLabel(upW)}) & retour ${ex.minReps} reps`;
                strengths.push(`${ex.shortName} : plafond 15 reps validé → ${loadLabel(upW)}.`);
              } else {
                nextTargetReps = ex.maxReps;
                nextRir = Math.max(0, presc.targetRir - 1);
                ruleReason = "Plafond 20 kg × 15 reps atteint";
              }
            } else {
              nextTargetReps = Math.min(ex.maxReps, minDone + 1);
              nextRir = Math.max(0, presc.targetRir - 1);
              pctChange = Math.round(((nextTargetReps - Math.max(1, minDone)) / Math.max(1, minDone)) * 1000) / 10;
              ruleReason = `Double Prog. PDC/KB : +1 rep cible (${minDone} → ${nextTargetReps})`;
              strengths.push(`${ex.shortName} : +1 rep cible (${nextTargetReps}r @ ${loadLabel(nextWeight)}).`);
            }
            transitionText = nextWeight !== presc.weight
              ? `${loadLabel(presc.weight)} (${ex.maxReps}r) → ${loadLabel(nextWeight)} (${nextTargetReps}r)`
              : `${minDone}r → ${nextTargetReps}r @ ${loadLabel(nextWeight)}`;
          } else if (ex.equip === "landmine_5" || ex.equip === "technogym_5") {
            const minDone = Math.min(...doneSets.map(s => Number(s.reps) || 0));
            if (allHitMax) {
              const upW = snapToEquipment(ex.equip, baseW, "up");
              nextWeight = upW;
              nextTargetReps = ex.minReps;
              nextRir = 2;
              pctChange = baseW > 0 ? Math.round(((upW - baseW) / baseW) * 1000) / 10 : 0;
              ruleReason = `Plafond ${ex.maxReps} reps validé → +5 kg (${formatKg(upW)} kg) & retour ${ex.minReps}r`;
              strengths.push(`${ex.shortName} : ${ex.maxReps} reps validées → passage à ${formatKg(upW)} kg.`);
            } else {
              nextWeight = snapToEquipment(ex.equip, baseW, "nearest");
              nextTargetReps = Math.min(ex.maxReps, minDone + 1);
              nextRir = Math.max(0, presc.targetRir - 1);
              pctChange = 0;
              ruleReason = `Double Prog. (pas 5 kg) : maintien ${formatKg(nextWeight)} kg, viser ${nextTargetReps} reps`;
            }
            transitionText = nextWeight !== presc.weight
              ? `${formatKg(presc.weight)} kg → ${formatKg(nextWeight)} kg (${nextTargetReps}r)`
              : `${formatKg(nextWeight)} kg (${minDone}r → ${nextTargetReps}r)`;
          } else {
            // Fine Matrix grids (matrix_chest, matrix_shoulder, matrix_cable_1)
            const hitRecord = bestE1RM >= prevRecord || prevRecord === 0;
            if (presc.targetRir >= 2) {
              if (hitRecord) {
                nextWeight = snapToEquipment(ex.equip, baseW, "up");
                nextRir = 1;
                pctChange = baseW > 0 ? Math.round(((nextWeight - baseW) / baseW) * 1000) / 10 : 0;
                ruleReason = `Double Prog. S1 → cran supérieur (${formatKg(nextWeight)} kg) & RIR 1`;
                strengths.push(`${ex.shortName} : record e1RM (${bestE1RM}), passage cran ${formatKg(nextWeight)} kg.`);
              } else {
                ruleReason = "Consolidation au cran actuel (RIR 2)";
              }
            } else if (presc.targetRir === 1) {
              if (hitRecord) {
                nextWeight = snapToEquipment(ex.equip, baseW, "up");
                nextRir = 0;
                pctChange = baseW > 0 ? Math.round(((nextWeight - baseW) / baseW) * 1000) / 10 : 0;
                ruleReason = `Double Prog. S2 → cran supérieur (${formatKg(nextWeight)} kg) & RIR 0`;
                strengths.push(`${ex.shortName} : surcharge validée (${formatKg(nextWeight)} kg), pic RIR 0.`);
              } else {
                ruleReason = "Consolidation au cran actuel (RIR 1)";
              }
            } else {
              if (allHitMax) {
                nextWeight = snapToEquipment(ex.equip, baseW, "up");
                nextRir = 2;
                nextTargetReps = ex.minReps;
                pctChange = baseW > 0 ? Math.round(((nextWeight - baseW) / baseW) * 1000) / 10 : 0;
                ruleReason = `Haut de fourchette (${ex.maxReps}r) validé → cran ${formatKg(nextWeight)} kg & RIR 2`;
                strengths.push(`${ex.shortName} : plafond ${ex.maxReps} reps franchi (${formatKg(nextWeight)} kg).`);
              } else {
                ruleReason = `Maintien RIR 0 (viser ${ex.maxReps} reps sur toutes séries)`;
              }
            }
          }
        }

        if (!transitionText) {
          transitionText = `${loadLabel(presc.weight)} → ${loadLabel(nextWeight)}`;
        }

        state.prescriptions[exId] = {
          weight: nextWeight,
          targetRir: nextRir,
          targetReps: nextTargetReps
        };

        const deltaPct = (bestE1RM > 0 && prevLast > 0)
          ? Math.round(((bestE1RM - prevLast) / prevLast) * 1000) / 10
          : 0;

        exSummaries.push({
          exId,
          status,
          sets: sets.map(s => ({ weight: s.weight, reps: s.reps, rir: s.rir, done: s.done })),
          bestE1RM,
          prevE1RM: prevLast,
          deltaPct,
          unit: ex.type === "isometric" ? "idx" : "kg"
        });

        adjustments.push({
          exId,
          name: ex.shortName,
          oldWeight: presc.weight,
          newWeight: nextWeight,
          oldRir: presc.targetRir,
          newRir: nextRir,
          pctChange,
          status,
          reason: ruleReason,
          transitionText,
          isBodyweight: ex.equip === "pdc_kb10" && nextWeight === 0
        });
      });

      if (!strengths.length && totalHardSets > 0) {
        strengths.push(`Séance complète (${totalHardSets} séries effectives à RIR ≤ 3) avec densité maîtrisée.`);
      }
      if (rpe >= 9) {
        suboptimals.push(`RPE global élevé (${rpe}/10) : surveiller la récupération SNC.`);
      }

      const quality = (siPain >= 4 || exSummaries.some(e => e.status === "ABANDON" || e.status === "Échec"))
        ? "suboptimal" : "optimal";

      const logEntry = {
        id: "sess_" + Date.now(),
        date: todayStr,
        workoutCode: active.workoutCode,
        title: workout.title,
        mesocycle: state.cycle.mesocycle,
        week: state.cycle.week,
        phase: state.cycle.phase,
        durationSec: totalSec,
        timeSplit: { activePct, restPct, transPct },
        densityScore,
        totalHardSets,
        rpe: Number(rpe),
        siPain: Number(siPain),
        siAction,
        quality,
        strengths: strengths.slice(0, 4),
        suboptimals: suboptimals.slice(0, 4),
        exercises: exSummaries,
        adjustments
      };

      state.history.push(logEntry);

      if (state.cycle.phase === "deload") {
        state.cycle.deloadSessionsDone = (state.cycle.deloadSessionsDone || 0) + 1;
        if (state.cycle.deloadSessionsDone >= 4) {
          state.cycle.mesocycle += 1;
          state.cycle.week = 1;
          state.cycle.phase = "accumulation";
          state.cycle.accumulationSessions = 0;
          state.cycle.deloadSessionsDone = 0;
          state.cycle.dismissedSignalSignature = "";
          Object.keys(state.prescriptions).forEach(k => { state.prescriptions[k].targetRir = 2; });
          logEntry.cycleTransition = `Décharge terminée ! Passage automatique en Mésocycle ${state.cycle.mesocycle} — Semaine 1 (RIR 2).`;
        }
      } else {
        state.cycle.accumulationSessions = (state.cycle.accumulationSessions || 0) + 1;
        state.cycle.week = Math.floor(state.cycle.accumulationSessions / 4) + 1;
      }

      const evalSig = evaluateMesocycleSignals(state);
      state.cycle.lastSignals = evalSig;
      if (evalSig.triggered && state.cycle.dismissedSignalSignature) {
        state.cycle.repromptReason = (evalSig.signature === state.cycle.dismissedSignalSignature)
          ? "Signal persistant" : "Nouveau signal";
        state.cycle.bannerHiddenUntilNextSession = false;
      } else {
        state.cycle.repromptReason = "";
        state.cycle.bannerHiddenUntilNextSession = false;
      }

      state.activeSession = null;
      return logEntry;
    }

    function applyCalibrationToProgram(state) {
      const res = state.calibration.results;
      const chest1RM = res.ua_chest?.e1rm || 85;
      const lat1RM   = res.ua_lat_tri?.e1rm || 80;
      const sh1RM    = res.ub_sh_press?.e1rm || 60;
      const row1RM   = res.ub_lm_row?.e1rm || 45;
      const gob1RM   = res.la_goblet?.e1rm || 50;
      const rdl1RM   = res.lb_rdl?.e1rm || 65;

      const deriveLoad = (exId, e1rm, pct, pain) => {
        const safety = Number(pain) >= 4 ? 0.85 : 1.0;
        return snapToEquipment(EXERCISES[exId].equip, e1rm * pct * safety, "nearest");
      };

      const pChest = res.ua_chest?.pain || 0;
      const pLat   = res.ua_lat_tri?.pain || 0;
      const pSh    = res.ub_sh_press?.pain || 0;
      const pRow   = res.ub_lm_row?.pain || 0;
      const pGob   = res.la_goblet?.pain || 0;
      const pRdl   = res.lb_rdl?.pain || 0;

      const derived = {
        ua_chest:       deriveLoad("ua_chest",       chest1RM,      0.70, pChest),
        ua_lat_tri:     deriveLoad("ua_lat_tri",     lat1RM,        0.70, pLat),
        ua_lm_press:    deriveLoad("ua_lm_press",    sh1RM * 0.45,  0.70, pSh),
        ua_lat_wide:    deriveLoad("ua_lat_wide",    lat1RM * 0.85, 0.68, pLat),
        ua_tri:         deriveLoad("ua_tri",         chest1RM * 0.22, 0.65, pChest),
        la_goblet:      deriveLoad("la_goblet",      gob1RM,        0.70, pGob),
        la_split:       0,
        la_pallof:      snapToEquipment("matrix_cable_1", 5.67, "nearest"),
        ub_sh_press:    deriveLoad("ub_sh_press",    sh1RM,         0.70, pSh),
        ub_lm_row:      deriveLoad("ub_lm_row",      row1RM,        0.70, pRow),
        ub_fly:         deriveLoad("ub_fly",         chest1RM * 0.16, 0.70, pChest),
        ub_facepull:    deriveLoad("ub_facepull",    lat1RM * 0.18, 0.68, pLat),
        ub_lat_raise:   deriveLoad("ub_lat_raise",   sh1RM * 0.12,  0.65, pSh),
        ub_curl:        deriveLoad("ub_curl",        lat1RM * 0.16, 0.68, pLat),
        lb_rdl:         deriveLoad("lb_rdl",         rdl1RM,        0.70, pRdl),
        lb_pullthrough: deriveLoad("lb_pullthrough", rdl1RM * 0.30, 0.68, pRdl),
        lb_carry:       10
      };

      const today = getEffectiveToday(state);
      Object.keys(EXERCISES).forEach(id => {
        state.prescriptions[id] = { weight: derived[id], targetRir: 2, targetReps: EXERCISES[id].minReps };
      });
      Object.keys(res).forEach(id => {
        if (!state.e1rmHistory[id]) state.e1rmHistory[id] = [];
        state.e1rmHistory[id].push({ date: today, value: res[id].e1rm });
      });

      state.clinical.siAlertActive = [pGob, pRdl].some(p => Number(p) >= 4);
      state.calibration.active = false;
      state.calibration.completed = true;
      state.cycle = {
        mesocycle: 1, week: 1, phase: "accumulation",
        accumulationSessions: 0, deloadSessionsDone: 0,
        dismissedSignalSignature: "", bannerHiddenUntilNextSession: false,
        repromptReason: "", lastSignals: { triggered: false, signals: [], signature: "" }
      };
    }

    /* ========================================================================
       8. MIGRATION (v0.4.8 -> v0.5.0) & DEMO WEEK 2 FACTORY
       ======================================================================== */
    function migrateStateIfNeeded(st) {
      if (!st || !st.profile) return createDemoWeek2State();
      const idMap = { la_lunge: "la_split", lb_bridge: "lb_pullthrough" };

      if (!st.prescriptions) st.prescriptions = {};
      if (!st.e1rmHistory) st.e1rmHistory = {};
      if (!st.clinical) st.clinical = { siAlertActive: false };
      if (!st.calibration) st.calibration = { active: false, completed: true, doneUpper: true, doneLower: true, results: {} };
      if (!st.mcgill) st.mcgill = {};

      Object.keys(idMap).forEach(oldId => {
        const newId = idMap[oldId];
        if (st.prescriptions[oldId] && !st.prescriptions[newId]) st.prescriptions[newId] = st.prescriptions[oldId];
        delete st.prescriptions[oldId];
        if (st.e1rmHistory[oldId] && !st.e1rmHistory[newId]) st.e1rmHistory[newId] = st.e1rmHistory[oldId];
        delete st.e1rmHistory[oldId];
      });
      delete st.prescriptions.ub_shrug;

      const defaults = {
        ua_chest: 60.5, ua_lat_tri: 60, ua_lm_press: 25, ua_lat_wide: 50, ua_tri: 12.48,
        la_goblet: 35, la_split: 0, la_pallof: 5.67,
        ub_sh_press: 42.8, ub_lm_row: 30, ub_fly: 10.21, ub_facepull: 10.21, ub_lat_raise: 5.67, ub_curl: 10.21,
        lb_rdl: 45, lb_pullthrough: 14.75, lb_carry: 10
      };

      Object.keys(EXERCISES).forEach(id => {
        const ex = EXERCISES[id];
        if (!st.prescriptions[id]) {
          st.prescriptions[id] = { weight: defaults[id], targetRir: 2, targetReps: ex.minReps };
        } else {
          st.prescriptions[id].weight = snapToEquipment(ex.equip, st.prescriptions[id].weight, "nearest");
          if (typeof st.prescriptions[id].targetRir !== "number") st.prescriptions[id].targetRir = 2;
          if (!st.prescriptions[id].targetReps) st.prescriptions[id].targetReps = ex.minReps;
        }
      });

      if (Array.isArray(st.history)) {
        st.history.forEach(sess => {
          (sess.exercises || []).forEach(e => { if (idMap[e.exId]) e.exId = idMap[e.exId]; });
          (sess.adjustments || []).forEach(a => { if (idMap[a.exId]) a.exId = idMap[a.exId]; });
        });
      }

      if (st.activeSession && st.version !== APP_VERSION) {
        st.activeSession = null;
      }

      st.version = APP_VERSION;
      return st;
    }

    function renderE1RMChartSVG(points, unit) {
      if (!points || !points.length) {
        return `<div class="text-xs text-muted" style="padding:14px 0;text-align:center;">Pas encore d'historique e1RM.</div>`;
      }
      const last = points[points.length - 1].value;
      const proj1 = Math.round(last * 1.028 * 10) / 10;
      const proj2 = Math.round(proj1 * 1.025 * 10) / 10;
      const allVals = [...points.map(p => p.value), proj1, proj2];
      const minV = Math.min(...allVals) * 0.94;
      const maxV = Math.max(...allVals) * 1.05;
      const span = Math.max(1, maxV - minV);

      const W = 340, H = 128, padL = 18, padR = 18, padT = 22, padB = 22;
      const totalPts = points.length + 2;
      const xAt = (i) => padL + (i / Math.max(1, totalPts - 1)) * (W - padL - padR);
      const yAt = (v) => H - padB - ((v - minV) / span) * (H - padT - padB);

      const histCoords = points.map((p, i) => ({ x: xAt(i), y: yAt(p.value), v: p.value, lbl: formatShortDate(p.date) }));
      const projCoords = [
        histCoords[histCoords.length - 1],
        { x: xAt(points.length), y: yAt(proj1), v: proj1, lbl: "N+1" },
        { x: xAt(points.length + 1), y: yAt(proj2), v: proj2, lbl: "N+2" }
      ];

      const histLine = histCoords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
      const projLine = projCoords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
          <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
          <polyline fill="none" stroke="#0A84FF" stroke-width="2.5" stroke-linejoin="round" points="${histLine}"/>
          <polyline fill="none" stroke="#FF9F0A" stroke-width="2" stroke-dasharray="5,4" points="${projLine}"/>
          ${histCoords.map(c => `
            <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.6" fill="#0A84FF"/>
            <text x="${c.x.toFixed(1)}" y="${(c.y - 7).toFixed(1)}" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">${c.v}</text>
            <text x="${c.x.toFixed(1)}" y="${H - 6}" fill="#A1A1A6" font-size="8" text-anchor="middle">${c.lbl}</text>
          `).join("")}
          ${projCoords.slice(1).map(c => `
            <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.2" fill="#FF9F0A"/>
            <text x="${c.x.toFixed(1)}" y="${(c.y - 7).toFixed(1)}" fill="#FF9F0A" font-size="9" font-weight="700" text-anchor="middle">${c.v}</text>
            <text x="${c.x.toFixed(1)}" y="${H - 6}" fill="#FF9F0A" font-size="8" text-anchor="middle">${c.lbl}</text>
          `).join("")}
        </svg>
        <div class="text-xs text-muted" style="display:flex;justify-content:space-between;margin-top:2px;">
          <span><strong style="color:#0A84FF;">●</strong> Historique réel (${unit})</span>
          <span><strong style="color:#FF9F0A;">---</strong> Projection Markov</span>
        </div>
      `;
    }

    let STATE = null;

    function showToast(msg) {
      const root = document.getElementById("toast-root");
      root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
      clearTimeout(TOAST_TIMER);
      TOAST_TIMER = setTimeout(() => { root.innerHTML = ""; }, 2800);
    }

    function saveAndRender(preserveScroll) {
      const y = window.scrollY;
      DB.scheduleSave(STATE);
      render();
      if (preserveScroll) window.scrollTo(0, y);
    }

    function startRestTimer(seconds, label) {
      if (!STATE.activeSession || !seconds || seconds <= 0) return;
      Sound.ensure();
      STATE.activeSession.restTimer = {
        endAt: Date.now() + seconds * 1000,
        totalSec: seconds,
        label: label || "Repos",
        lastBeepSec: null
      };
      STATE.activeSession.totalRestSec = (STATE.activeSession.totalRestSec || 0) + seconds;
      DB.scheduleSave(STATE);
      renderFloatingTimer();
    }

    function adjustRestTimer(deltaSec) {
      if (!STATE.activeSession || !STATE.activeSession.restTimer) return;
      const rt = STATE.activeSession.restTimer;
      const rem = Math.max(0, Math.ceil((rt.endAt - Date.now()) / 1000)) + deltaSec;
      if (rem <= 0) {
        STATE.activeSession.restTimer = null;
      } else {
        rt.endAt = Date.now() + rem * 1000;
        rt.lastBeepSec = null;
      }
      DB.scheduleSave(STATE);
      renderFloatingTimer();
    }

    function startTicker() {
      if (TICKER) clearInterval(TICKER);
      TICKER = setInterval(() => {
        if (!STATE || !STATE.activeSession) return;
        const elapsedEl = document.getElementById("session-elapsed-live");
        if (elapsedEl) {
          elapsedEl.textContent = formatMMSS((Date.now() - STATE.activeSession.startedAt) / 1000);
        }
        const stickyElapsed = document.getElementById("sticky-resume-timer");
        if (stickyElapsed) {
          stickyElapsed.textContent = formatMMSS((Date.now() - STATE.activeSession.startedAt) / 1000);
        }

        const rt = STATE.activeSession.restTimer;
        if (rt) {
          const rem = Math.ceil((rt.endAt - Date.now()) / 1000);
          if (rem <= 5 && rem >= 1 && rt.lastBeepSec !== rem) {
            rt.lastBeepSec = rem;
            Sound.tick();
          }
          if (rem <= 0) {
            Sound.done();
            STATE.activeSession.restTimer = null;
            DB.scheduleSave(STATE);
            renderFloatingTimer();
          } else {
            renderFloatingTimer();
          }
        }
      }, 250);
    }

    /* ========================================================================
       11. SESSION START / FREE LAUNCH GUARD
       ======================================================================== */
    function requestStartWorkout(workoutCode) {
      if (STATE.activeSession) {
        openActiveGuardModal(workoutCode);
      } else {
        startRegularWorkout(workoutCode);
      }
    }

    function startRegularWorkout(workoutCode) {
      Sound.ensure();
      const wk = WORKOUTS[workoutCode];
      const setsFlat = [];
      wk.blocks.forEach(blk => {
        blk.exIds.forEach(exId => {
          const ex = EXERCISES[exId];
          const nSets = getEffectiveTargetSets(ex, STATE);
          const presc = STATE.prescriptions[exId] || { weight: snapToEquipment(ex.equip, 20), targetRir: ex.defaultRir, targetReps: ex.minReps };
          const targetRir = getEffectiveTargetRir(ex, STATE);
          const startReps = presc.targetReps || ex.minReps;
          for (let i = 0; i < nSets; i++) {
            setsFlat.push({
              uid: `${exId}_${i}_${Date.now().toString(36).slice(-3)}`,
              blockId: blk.id,
              exId,
              setIndex: i,
              weight: snapToEquipment(ex.equip, presc.weight, "nearest"),
              reps: startReps,
              rir: targetRir,
              done: false
            });
          }
        });
      });

      STATE.activeSession = {
        mode: "workout",
        workoutCode,
        title: wk.title,
        startedAt: Date.now(),
        totalRestSec: 0,
        restTimer: null,
        setsFlat
      };
      VIEW = { name: "workout", param: null };
      DB.scheduleSave(STATE);
      render();
      window.scrollTo(0, 0);
    }

    function startCalibrationSession(calCode) {
      Sound.ensure();
      const cal = CALIBRATION_SESSIONS[calCode];
      const steps = [];
      cal.exIds.forEach(exId => {
        const ex = EXERCISES[exId];
        const baseW = (STATE.prescriptions[exId]?.weight) || snapToEquipment(ex.equip, 40);
        steps.push({
          uid: `${exId}_w1`, exId, kind: "warmup1", label: "Échauffement 1 (~50%)",
          weight: snapToEquipment(ex.equip, baseW * 0.5), reps: 10, pain: 0, done: false
        });
        steps.push({
          uid: `${exId}_w2`, exId, kind: "warmup2", label: "Échauffement 2 (~75%)",
          weight: snapToEquipment(ex.equip, baseW * 0.75), reps: 6, pain: 0, done: false
        });
        steps.push({
          uid: `${exId}_top`, exId, kind: "topset", label: "TOP SET (6–10 reps, RIR 0 tech)",
          weight: snapToEquipment(ex.equip, baseW), reps: 8, pain: 0, done: false
        });
      });

      STATE.activeSession = {
        mode: "calibration",
        workoutCode: calCode,
        title: cal.title,
        startedAt: Date.now(),
        totalRestSec: 0,
        restTimer: null,
        steps
      };
      VIEW = { name: "workout", param: null };
      DB.scheduleSave(STATE);
      render();
      window.scrollTo(0, 0);
    }

      const root = document.getElementById("floating-timer-root");

        root.innerHTML = "";
        return;
      }
      const rt = STATE.activeSession.restTimer;

      root.innerHTML = `

    function getWeeklyHardSetsByMuscle(state, todayStr) {
      const mon = getMondayOfWeek(todayStr);
      const sun = addDays(mon, 6);
      const counts = {};
      Object.keys(MUSCLE_GROUPS).forEach(k => { counts[k] = 0; });

      (state.history || []).forEach(sess => {
        if (sess.date >= mon && sess.date <= sun) {
          (sess.exercises || []).forEach(exLog => {
            const ex = EXERCISES[exLog.exId];
            if (!ex) return;
            const valid = (exLog.sets || []).filter(s => s.done && Number(s.rir) <= 3).length;
            counts[ex.muscle] = (counts[ex.muscle] || 0) + valid;
          });
        }
      });
      return counts;
    }

      const weeklySets = getWeeklyHardSetsByMuscle(STATE, todayStr);

      const renderMuscleCard = (key) => {
        const mg = MUSCLE_GROUPS[key];
        const done = weeklySets[key] || 0;
        const pct = Math.min(100, Math.round((done / mg.targetSets) * 100));
        const refEx = EXERCISES[mg.refEx];
        const hist = STATE.e1rmHistory[mg.refEx] || [];
        const curE1 = hist.length ? hist[hist.length - 1].value : 0;
        const prevE1 = hist.length >= 2 ? hist[hist.length - 2].value : 0;
        const diffPct = (curE1 > 0 && prevE1 > 0) ? Math.round(((curE1 - prevE1) / prevE1) * 1000) / 10 : 0;
        const badgeCls = diffPct > 0 ? "badge-green" : diffPct < 0 ? "badge-red" : "badge-gray";

        return `
          <div class="muscle-card" data-action="open-muscle" data-muscle="${escapeHtml(key)}">

            <div class="mc-line2">
              <div class="prog-track"><div class="prog-fill ${done >= mg.targetSets ? "complete" : ""}" style="width:${pct}%"></div></div>

      const dosKeys = Object.keys(MUSCLE_GROUPS).filter(k => MUSCLE_GROUPS[k].side === "dos");

      // Context sticky CTA
      const weekMon = getMondayOfWeek(todayStr);
      const sched = computeWeekSchedule(weekMon, STATE, todayStr);
      const todayCode = sched[todayStr];

      let stickyBtn = "";
      if (STATE.activeSession) {

              <div class="muscle-col">
                <div class="text-xs fw-700 text-muted" style="text-align:center;">DOS</div>
